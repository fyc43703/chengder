        /**
         * Dynamically loads a script and returns a promise that resolves ONLY when the script is loaded
         * AND the expected global variable is available. This is the most robust way to handle this.
         * @param {string} src - The URL of the script to load.
         * @param {string} globalVar - The name of the global variable the script is expected to create.
         * @returns {Promise<void>}
         */
        function loadScript(src, globalVar) {
            if (window[globalVar]) return Promise.resolve();
            loadScript.pending ||= new Map();
            if (loadScript.pending.has(src)) return loadScript.pending.get(src);
            const promise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                const timer = setTimeout(() => done(new Error('元件下載逾時，請重試。')), 20000);
                function done(error) {
                    clearTimeout(timer);
                    script.onload = script.onerror = null;
                    if (error) { script.remove(); reject(error); } else resolve();
                }
                script.src = src;
                script.onload = () => done(window[globalVar] ? null : new Error('元件未正確啟動。'));
                script.onerror = () => done(new Error('無法下載元件，請確認連線後重試。'));
                document.head.appendChild(script);
            });
            loadScript.pending.set(src, promise);
            promise.catch(() => loadScript.pending.delete(src));
            return promise;
        }

        async function createExportCanvas(pageNum, initialScale) {
            const pageData = pdfPageData[pageNum];
            if (!pageData) return null;

            const page = pageData.pageRef;
            let viewport = page.getViewport({ scale: initialScale });

            const MAX_CANVAS_PIXELS = 16777216; // 4096 * 4096, a safe limit for most browsers
            let finalScale = initialScale;
            if (viewport.width * viewport.height > MAX_CANVAS_PIXELS) {
                finalScale = Math.sqrt(MAX_CANVAS_PIXELS / (viewport.width / initialScale * viewport.height / initialScale));
                console.warn(`頁面 ${pageNum} 的匯出解析度過高，已從 ${initialScale.toFixed(2)}x 自動調整為 ${finalScale.toFixed(2)}x 以避免瀏覽器錯誤。`);
                viewport = page.getViewport({ scale: finalScale });
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = viewport.width;
            tempCanvas.height = viewport.height;
            const tempCtx = tempCanvas.getContext('2d');

            await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;

            pageData.textItems.forEach(item => {
                if (item.isModified) {
                    drawModifiedTextOnCanvas(tempCtx, item, finalScale, viewport);
                }
            });

            pageData.drawings.forEach(item => {
                drawSavedItem(tempCtx, item, finalScale);
            });
            
            return tempCanvas;
        }

        async function exportPDF() {
            if (Object.keys(pdfPageData).length === 0) { 
                showStatus('沒有可匯出的 PDF', 'error'); 
                return; 
            }
            
            const settings = getExportSettings();
            if (!settings.isValid) {
                showStatus(settings.errorMessage, 'error');
                return;
            }

            showSpinner('正在準備匯出 PDF...');

            try {
                updateSpinnerStatus('正在載入 PDF 核心程式庫...');
                // FINAL FIX: Use the correct variable name 'PDFLib' (capital L)
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', 'PDFLib');
                
                const { PDFDocument } = PDFLib;
                const pdfLibDoc = await PDFDocument.create();

                for (let pageNum = settings.startPage; pageNum <= settings.endPage; pageNum++) {
                    const progress = pageNum - settings.startPage + 1;
                    const total = settings.endPage - settings.startPage + 1;
                    updateSpinnerStatus(`正在處理 PDF 第 ${progress} / ${total} 頁...`);
                    
                    const tempCanvas = await createExportCanvas(pageNum, settings.scale);
                    if (!tempCanvas) continue;

                    const pngImageBytes = await pdfLibDoc.embedPng(tempCanvas.toDataURL('image/png'));
                    const original = pdfPageData[pageNum].pageRef.getViewport({scale: 1});
                    const pdfPage = pdfLibDoc.addPage([original.width, original.height]);
                    pdfPage.drawImage(pngImageBytes, { x: 0, y: 0, width: original.width, height: original.height });
                }

                updateSpinnerStatus('正在產生最終 PDF 檔案...');
                const pdfBytesModified = await pdfLibDoc.save();
                const blob = new Blob([pdfBytesModified], { type: 'application/pdf' });

                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'edited_document.pdf';
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(a.href);
                a.remove();

                hideSpinner();
            } catch (error) {
                hideSpinner();
                const errorMessage = error.message || '未知錯誤';
                const finalMessage = `PDF 匯出失敗：${errorMessage}。請確認網路連線後重試，或降低匯出解析度；目前的修改仍保留於此頁面。`;
                showStatus(finalMessage, 'error', 10000);
                console.error("PDF Export failed:", error);
            }
        }

        async function exportPNGZip() {
            if (Object.keys(pdfPageData).length === 0) { showStatus('沒有可匯出的 PDF', 'error'); return; }
            
            const settings = getExportSettings();
            if (!settings.isValid) {
                showStatus(settings.errorMessage, 'error');
                return;
            }

            showSpinner('正在準備匯出 PNG (ZIP)...');

            try {
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'JSZip');
                const zip = new JSZip();

                for (let pageNum = settings.startPage; pageNum <= settings.endPage; pageNum++) {
                    const progress = pageNum - settings.startPage + 1;
                    const total = settings.endPage - settings.startPage + 1;
                    updateSpinnerStatus(`正在處理 PNG 第 ${progress} / ${total} 頁...`);
                    
                    const tempCanvas = await createExportCanvas(pageNum, settings.scale);
                    if (!tempCanvas) continue;

                    const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, 'image/png'));
                    if (blob && blob.size > 0) {
                        zip.file(`page_${pageNum}.png`, blob);
                    } else {
                        console.warn(`頁面 ${pageNum} 產生的 PNG 檔案為空，已略過。`);
                    }
                }

                updateSpinnerStatus('正在產生 ZIP 檔案...');
                const zipBlob = await zip.generateAsync({ type: 'blob' });

                const a = document.createElement('a');
                a.href = URL.createObjectURL(zipBlob);
                a.download = 'edited_pages.zip';
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(a.href);
                a.remove();

                hideSpinner();
            } catch (error) {
                hideSpinner();
                const errorMessage = error.message || error.toString();
                showStatus('PNG (ZIP) 匯出失敗: ' + errorMessage, 'error');
                console.error("PNG (ZIP) Export failed:", error);
            }
        }

        let scrollTimeout;
        function onScrollViewerScroll() {
            if (scrollTimeout) {
                window.cancelAnimationFrame(scrollTimeout);
            }
            scrollTimeout = window.requestAnimationFrame(updateCurrentPage);
        }

        function updateCurrentPage() {
            if (Object.keys(pdfPageData).length === 0) return 1;
            const viewerRect = scrollableContent.getBoundingClientRect();
            const referenceY = viewerRect.top + 50;

            let currentPage = 1;
            const pageContainers = pdfViewer.querySelectorAll('.pdf-page-container');

            for(let i = 0; i < pageContainers.length; i++) {
                const pageRect = pageContainers[i].getBoundingClientRect();
                if (referenceY >= pageRect.top && referenceY <= pageRect.bottom) {
                     currentPage = i + 1;
                     break;
                }
                 if (referenceY < pageRect.top) {
                    currentPage = i > 0 ? i : 1;
                    break;
                }
                 if (referenceY > pageRect.bottom) {
                    currentPage = i + 1;
                }
            }
            currentPageIndicator.textContent = currentPage;
            return currentPage;
        }
        
        async function setActivePreviewPage(pageNum) {
            const totalPages = Object.keys(pdfPageData).length;
            if (pageNum < 1 || totalPages === 0 || pageNum > totalPages) return;
            
            currentPreviewPage = pageNum;
            
            document.querySelectorAll('.preview-thumbnail').forEach(thumb => {
                thumb.classList.toggle('active', parseInt(thumb.dataset.pageNum) === pageNum);
            });

            const activeThumb = document.querySelector(`.preview-thumbnail.active`);
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            previewDeletePageBtn.style.display = 'inline-flex';

            const mainImage = document.getElementById('previewMainImage');
            const statusDiv = document.getElementById('previewImageStatus');
            
            mainImage.style.visibility = 'hidden';
            statusDiv.textContent = '正在載入頁面...';
            
            mainImage.onload = () => {
                mainImage.style.visibility = 'visible';
                statusDiv.textContent = '';
                previewFitPageBtn.click(); 
            };
            mainImage.onerror = () => {
                statusDiv.textContent = '頁面預覽載入失敗';
                mainImage.style.visibility = 'visible';
            };
            
            try {
                const pageData = pdfPageData[pageNum];
                if (!pageData) throw new Error(`Page ${pageNum} data not found.`);

                if (previewImageCache[pageNum]) {
                    mainImage.src = previewImageCache[pageNum];
                } else {
                    const page = pageData.pageRef;
                    const desiredWidth = 1500;
                    const viewport = page.getViewport({ scale: 1.0 });
                    const scale = desiredWidth / viewport.width;
                    const scaledViewport = page.getViewport({ scale: scale });

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = scaledViewport.width;
                    tempCanvas.height = scaledViewport.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    await page.render({ canvasContext: tempCtx, viewport: scaledViewport }).promise;
                    
                    pageData.textItems.forEach(item => {
                        if (item.isModified) drawModifiedTextOnCanvas(tempCtx, item, scale, scaledViewport);
                    });
                    pageData.drawings.forEach(item => {
                        drawSavedItem(tempCtx, item, scale);
                    });
                    
                    const dataUrl = tempCanvas.toDataURL('image/png');
                    previewImageCache[pageNum] = dataUrl;
                    mainImage.src = dataUrl;
                }
            } catch (error) {
                console.error(`Error rendering preview for page ${pageNum}:`, error);
                mainImage.onerror();
            }
            
            updatePreviewPageIndicator();
        }

        async function createThumbnail(pageData, pageNum) {
            const thumbCanvas = document.createElement('canvas');
            const thumbWidth = 120;
            
            const viewport = pageData.pageRef.getViewport({ scale: 1.0 });
            thumbCanvas.width = thumbWidth;
            thumbCanvas.height = viewport.height * (thumbWidth / viewport.width);
            const thumbViewport = pageData.pageRef.getViewport({ scale: thumbWidth / viewport.width });

            const renderContext = {
                canvasContext: thumbCanvas.getContext('2d'),
                viewport: thumbViewport
            };
            await pageData.pageRef.render(renderContext).promise;
            
            const thumbCtx = thumbCanvas.getContext('2d');
            const scale = thumbWidth / viewport.width;

            pageData.textItems.forEach(item => {
                if (item.isModified) {
                    drawModifiedTextOnCanvas(thumbCtx, item, scale, thumbViewport);
                }
            });
            pageData.drawings.forEach(item => {
                drawSavedItem(thumbCtx, item, scale);
            });

            const img = document.createElement('img');
            img.className = 'preview-thumbnail';
            img.dataset.pageNum = pageNum;
            img.draggable = true;
            img.title = `第 ${pageNum} 頁`;
            img.src = thumbCanvas.toDataURL('image/jpeg', 0.8);
            
            img.addEventListener('click', () => {
                setActivePreviewPage(parseInt(img.dataset.pageNum));
            });

            return img;
        }

        async function showPreview(targetPage = null) {
            if (Object.keys(pdfPageData).length === 0) return;
            showSpinner('正在產生縮圖...');
            
            previewImageCache = {};
            const thumbnailContainer = document.getElementById('previewThumbnailContainer');
            thumbnailContainer.innerHTML = '';
            
            const totalPages = Object.keys(pdfPageData).length;
            const thumbPromises = [];

            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                const pageData = pdfPageData[pageNum];
                if (pageData && pageData.pageRef) {
                    thumbPromises.push(createThumbnail(pageData, pageNum));
                }
            }

            try {
                const thumbnailElements = await Promise.all(thumbPromises);
                thumbnailContainer.append(...thumbnailElements);
            } catch (error) {
                 console.error("Error creating thumbnails:", error);
                 hideSpinner();
                 alert("生成縮圖時發生錯誤。");
                 return;
            }
            
            previewDeletePageBtn.style.display = 'inline-flex';
            previewDeletePageBtn.disabled = totalPages <= 1;

            const newActivePage = targetPage ? targetPage : updateCurrentPage();
            await setActivePreviewPage(newActivePage);
            
            hideSpinner();
            previewModalOverlay.style.display = 'flex';
            closePreviewModalBtn.focus();
            window.addEventListener('keydown', handlePreviewKeyDown);
        }
        
        function rekeyPdfPageData(pagesArray) {
            historyStack.push({actionType: 'pageLayout', pages: Object.values(pdfPageData)});
            updateUndoButtonState();
            selectedObject = null;
            document.getElementById('resize-handle-div')?.remove();
            const newPageData = {};
            pagesArray.forEach((page, index) => {
                const newPageNum = index + 1;
                newPageData[newPageNum] = page;
            });
            return newPageData;
        }


        function applyPreviewZoom() {
            if (!previewMainImage || !previewMainImage.naturalWidth) return;

            const container = previewImageContainer;
            const image = previewMainImage;

            const scaledWidth = image.naturalWidth * previewZoom;
            const scaledHeight = image.naturalHeight * previewZoom;
            
            if (scaledWidth <= container.clientWidth && scaledHeight <= container.clientHeight) {
                container.style.justifyContent = 'center';
                container.style.alignItems = 'center';
                image.style.transformOrigin = 'center center';
            } else {
                container.style.justifyContent = 'flex-start';
                container.style.alignItems = 'flex-start';
                image.style.transformOrigin = '0 0';
            }

            image.style.transform = `scale(${previewZoom})`;
            previewZoomLevel.textContent = `${Math.round(previewZoom * 100)}%`;
        }

        function updatePreviewPageIndicator() {
            const totalPages = Object.keys(pdfPageData).length;
            if (totalPages === 0) {
                 previewPageIndicator.textContent = `第 0 / 0 頁`;
                 totalPagesIndicator.textContent = 0;
                 return;
            }
            previewPageIndicator.textContent = `第 ${currentPreviewPage} / ${totalPages} 頁`;
            totalPagesIndicator.textContent = totalPages;
        }

        function getPageAndCoordsFromEvent(e) {
            const pageContainers = pdfViewer.querySelectorAll('.pdf-page-container');
            for (let i = 0; i < pageContainers.length; i++) {
                const rect = pageContainers[i].getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    return {
                        pageNum: i + 1,
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    };
                }
            }
            return { pageNum: null, x: null, y: null };
        }

        function toggleDrawingTool(tool, force = false) {
            if (colorPickerTarget) toggleColorPickerMode(colorPickerTarget);
            
            if (tool !== 'text' && punctuationSelect.value) {
                punctuationSelect.selectedIndex = 0;
            }

            if (tool === 'image') {
                imageInput.click();
                return;
            }

            if (!force && currentDrawingTool === tool) {
                currentDrawingTool = 'select';
            } else {
                currentDrawingTool = tool;
            }

            drawingTools.forEach(btn => {
                btn.classList.toggle('active', btn.id.endsWith(currentDrawingTool));
            });

            const imageCursor = "url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZHRoPSIzMiIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImJsYWNrIiBzdHJva2Utd2lkdGg9IjEuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2EtbGluZWpvaW49InJvdW5kIj48cGF0aCBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjMiIGQ9Ik0zIDNoMTh2MThIM3ogTTEyIDd2MTAgTTcgMTJoMTAiLz48cGF0aCBkPSJNMzYzaDE4djE八SDN6IE0xMiA3djEwIE03IDEyaDEwIi8+PC9zdmc+') 16 16, auto";

            if (currentDrawingTool === 'image-placement') {
                pdfViewer.style.cursor = imageCursor;
            } else if (currentDrawingTool === 'select') {
                pdfViewer.style.cursor = 'default';
            } else {

        function handleMouseDown(e) {
            if (colorPickerTarget) {
                pickColor(e);
                return;
            }
            if (e.target.classList.contains('clickable-area') || e.target.classList.contains('text-input-area')) return;

            if (currentDrawingTool === 'select') {
                handleSelectionMouseDown(e);
            } else {
                handleDrawingMouseDown(e);
            }
        }

        function handleMouseMove(e) {
            if (isResizing) {
                handleImageResize(e);
            } else if (isDragging) {
                handleSelectionMouseMove(e);
            } else if (currentDrawingTool === 'select') {
                const { pageNum, x, y } = getPageAndCoordsFromEvent(e);
                if (pageNum) {
                    const hitObject = hitTest(x, y, pageNum);
                    pdfViewer.style.cursor = hitObject?.handle ? 'nwse-resize' : (hitObject ? 'move' : 'default');
                }
            }
        }

        function handleDrawingMouseDown(e) {
            const { pageNum, x, y } = getPageAndCoordsFromEvent(e);
            if (!pageNum) return;

            const selectedSymbol = punctuationSelect.value;

            if (currentDrawingTool === 'text' && selectedSymbol) {
                placeSymbol(x, y, pageNum, selectedSymbol);
                return;
            }
            if (currentDrawingTool === 'text') {
                 createTextbox(x, y, pageNum);
                 return;
            }
            if (currentDrawingTool === 'image-placement' && pendingImage) {
                placeImage(x, y, pageNum);
                return;
            }
            isDrawing = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            
            tempCanvas = document.createElement('canvas');
            tempCanvas.style.position = 'fixed';
            tempCanvas.style.top = '0';
            tempCanvas.style.left = '0';
            tempCanvas.style.pointerEvents = 'none';
            tempCanvas.style.zIndex = '1000';
            tempCanvas.width = window.innerWidth;
            tempCanvas.height = window.innerHeight;
            document.body.appendChild(tempCanvas);
            tempCtx = tempCanvas.getContext('2d');


            window.addEventListener('mousemove', handleDrawingMouseMove);
            window.addEventListener('mouseup', handleDrawingMouseUp);
        }

        function handleDrawingMouseMove(e) {
            if (!isDrawing) return;
            tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            drawShape(tempCtx, currentDrawingTool, dragStartX, dragStartY, e.clientX, e.clientY);
        }

        function handleDrawingMouseUp(e) {
            if (!isDrawing) return;
            isDrawing = false;
            
            window.removeEventListener('mousemove', handleDrawingMouseMove);
            window.removeEventListener('mouseup', handleDrawingMouseUp);
            tempCanvas.remove();

            const endCoords = getPageAndCoordsFromEvent(e);
            const startCoords = getPageAndCoordsFromEvent({clientX: dragStartX, clientY: dragStartY});

            if (!startCoords || !startCoords.pageNum || !endCoords) return;

            const unscaledStartX = startCoords.x / currentScale;
            const unscaledStartY = startCoords.y / currentScale;
            const unscaledEndX = endCoords.x / currentScale;
            const unscaledEndY = endCoords.y / currentScale;

            const drawingData = {
                type: currentDrawingTool,
                color: strokeColorInput.value,
                width: parseFloat(strokeWidthInput.value),
            };

            if (currentDrawingTool === 'rect' || currentDrawingTool === 'fill-rect' || currentDrawingTool === 'rounded-rect') {
                drawingData.x = Math.min(unscaledStartX, unscaledEndX);
                drawingData.y = Math.min(unscaledStartY, unscaledEndY);
                drawingData.w = Math.abs(unscaledEndX - unscaledStartX);
                drawingData.h = Math.abs(unscaledEndY - unscaledStartY);
                if (currentDrawingTool === 'rounded-rect') drawingData.radius = 10;
            } else if (currentDrawingTool === 'ellipse') {
                drawingData.x = (unscaledStartX + unscaledEndX) / 2;
                drawingData.y = (unscaledStartY + unscaledEndY) / 2;
                drawingData.rx = Math.abs(unscaledEndX - unscaledStartX) / 2;
                drawingData.ry = Math.abs(unscaledEndY - unscaledStartY) / 2;
            } else {
                drawingData.x1 = unscaledStartX;
                drawingData.y1 = unscaledStartY;
                drawingData.x2 = unscaledEndX;
                drawingData.y2 = unscaledEndY;
            }

            pdfPageData[startCoords.pageNum].drawings.push(drawingData);
            historyStack.push({ actionType: 'addDrawing', pageNum: startCoords.pageNum });
            updateUndoButtonState();

            redrawPageCanvas(startCoords.pageNum);
            toggleDrawingTool(currentDrawingTool);
        }

        function handleSelectionMouseDown(e) {
            const { pageNum, x, y } = getPageAndCoordsFromEvent(e);
            if (!pageNum) return;

            const hitObject = hitTest(x, y, pageNum);

            document.getElementById('resize-handle-div')?.remove();

            if (hitObject) {
                selectedObject = hitObject;

                if (hitObject.obj.type === 'image' && !hitObject.handle) {
                    createResizeHandle(hitObject);
                }

                 dragStartX = e.clientX;
                 dragStartY = e.clientY;
                 draggingObject = hitObject;

                if (hitObject.handle) {
                    isResizing = true;
                    historyStack.push({ actionType: 'resizeImage', pageNum, index: draggingObject.index, oldState: { w: draggingObject.obj.w, h: draggingObject.obj.h } });
                } else {
                    isDragging = true;
                    const oldState = 'x' in draggingObject.obj ? { x: draggingObject.obj.x, y: draggingObject.obj.y } : { x1: draggingObject.obj.x1, y1: draggingObject.obj.y1, x2: draggingObject.obj.x2, y2: draggingObject.obj.y2 };
                    historyStack.push({ actionType: 'moveDrawing', pageNum, index: draggingObject.index, oldState });
                }
                updateUndoButtonState();
                window.addEventListener('mouseup', handleSelectionMouseUp);
            } else {
                 selectedObject = null;
            }
        }

        function handleSelectionMouseMove(e) {
            if (!isDragging) return;

            const dx = (e.clientX - dragStartX) / currentScale;
            const dy = (e.clientY - dragStartY) / currentScale;

            const obj = draggingObject.obj;
            if ('x' in obj) {
                 obj.x += dx; obj.y += dy;
            } else {
                obj.x1 += dx; obj.y1 += dy;
                obj.x2 += dx; obj.y2 += dy;
            }
            redrawPageCanvas(draggingObject.pageNum);

            if (draggingObject.obj.type === 'image') {
                updateResizeHandlePosition();
            }

            dragStartX = e.clientX;
            dragStartY = e.clientY;
        }

        function handleSelectionMouseUp(e) {
             if (isDragging || isResizing) {
                 if (draggingObject && draggingObject.obj.type === 'image') {
                    updateResizeHandlePosition();
                 }
            }

            isDragging = false;
            isResizing = false;
            draggingObject = null;
            window.removeEventListener('mouseup', handleSelectionMouseUp);
        }

        function handleImageResize(e) {
            if (!isResizing) return;
            const obj = draggingObject.obj;
            const dx = (e.clientX - dragStartX) / currentScale;
            const dy = (e.clientY - dragStartY) / currentScale;

            obj.w = Math.max(10, obj.w + dx);
            obj.h = Math.max(10, obj.h + dy);

            redrawPageCanvas(draggingObject.pageNum);
            updateResizeHandlePosition();
            dragStartX = e.clientX;
            dragStartY = e.clientY;
        }

        function createResizeHandle(selectedImg) {
            const { obj, pageNum } = selectedImg;
            const interactionLayer = document.getElementById(`interaction-layer-${pageNum}`);
            if (!interactionLayer) return;

            const handle = document.createElement('div');
            handle.id = 'resize-handle-div';
            handle.className = 'resize-handle';

            const scaledX = obj.x * currentScale;
            const scaledY = obj.y * currentScale;
            const scaledW = obj.w * currentScale;
            const scaledH = obj.h * currentScale;

            handle.style.left = (scaledX + scaledW - 5) + 'px';
            handle.style.top = (scaledY + scaledH - 5) + 'px';

            interactionLayer.appendChild(handle);
        }

        function updateResizeHandlePosition() {
            const handle = document.getElementById('resize-handle-div');
            if (!handle || !draggingObject) return;

            const { obj } = draggingObject;
            const scaledX = obj.x * currentScale;
            const scaledY = obj.y * currentScale;
            const scaledW = obj.w * currentScale;
            const scaledH = obj.h * currentScale;

            handle.style.left = (scaledX + scaledW - 5) + 'px';
            handle.style.top = (scaledY + scaledH - 5) + 'px';
        }


        function drawShape(ctx, tool, x1, y1, x2, y2) {
             ctx.strokeStyle = strokeColorInput.value;
             ctx.lineWidth = parseFloat(strokeWidthInput.value);
             ctx.fillStyle = strokeColorInput.value;
             ctx.lineCap = "round";
             ctx.lineJoin = "round";

             switch(tool) {
                case 'line': ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); break;
                case 'rect': ctx.beginPath(); ctx.rect(x1, y1, x2 - x1, y2 - y1); ctx.stroke(); break;
                case 'fill-rect': ctx.fillRect(x1, y1, x2 - x1, y2 - y1); break;
                case 'rounded-rect': 
                    drawRoundedRect(ctx, x1, y1, x2 - x1, y2 - y1, 10);
                    ctx.stroke();
                    break;
                case 'ellipse': ctx.beginPath(); ctx.ellipse((x1 + x2) / 2, (y1 + y2) / 2, Math.abs(x2 - x1) / 2, Math.abs(y2 - y1) / 2, 0, 0, 2 * Math.PI); ctx.stroke(); break;
                case 'arrow': drawArrow(ctx, x1, y1, x2, y2); break;
             }
        }
        
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            if (width < 2 * radius) radius = width / 2;
            if (height < 2 * radius) radius = height / 2;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
        }

        function drawArrow(ctx, fromx, fromy, tox, toy) {
            const headlen = Math.max(12, ctx.lineWidth * 2.5);
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            const length = Math.sqrt(dx * dx + dy * dy);

            const lineEndX = tox - (headlen * 0.9) * Math.cos(angle);
            const lineEndY = toy - (headlen * 0.9) * Math.sin(angle);

            if (length > headlen) {
                ctx.beginPath();
                ctx.moveTo(fromx, fromy);
                ctx.lineTo(lineEndX, lineEndY);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 7), toy - headlen * Math.sin(angle - Math.PI / 7));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 7), toy - headlen * Math.sin(angle + Math.PI / 7));
            ctx.closePath();
            ctx.fill();
        }

        function createTextbox(x, y, pageNum, initialText = '') {
            const interactionLayer = document.getElementById(`interaction-layer-${pageNum}`);
            if (!interactionLayer) return;

            const inputArea = document.createElement('div');
            inputArea.contentEditable = true;
            inputArea.className = 'text-input-area';
            inputArea.innerText = initialText;
            inputArea.style.left = x + 'px';
            inputArea.style.top = y + 'px';
            inputArea.style.fontFamily = fontSelect.value;
            inputArea.style.fontSize = fontSizeSelect.value + 'px';
            inputArea.style.color = fontColor.value;
            
            const isBold = fontBoldBtn.classList.contains('active');
            inputArea.style.fontWeight = isBold ? 'bold' : 'normal';

            interactionLayer.appendChild(inputArea);

            setTimeout(() => {
                inputArea.focus();
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(inputArea);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }, 0);

            inputArea.addEventListener('blur', () => {
                const text = inputArea.innerText;
                if (text.trim()) {
                    const textIsBold = inputArea.style.fontWeight === 'bold' || inputArea.style.fontWeight === '700';
                    const textData = {
                        type: 'text', text,
                        x: parseFloat(inputArea.style.left) / currentScale, 
                        y: parseFloat(inputArea.style.top) / currentScale,
                        font: inputArea.style.fontFamily, 
                        size: parseFloat(inputArea.style.fontSize),
                        color: inputArea.style.color,
                        fontWeight: textIsBold ? 'bold' : 'normal'
                    };
                    pdfPageData[pageNum].drawings.push(textData);
                    historyStack.push({ actionType: 'addDrawing', pageNum });
                    updateUndoButtonState();
                    redrawPageCanvas(pageNum);
                }
                if(currentDrawingTool === 'text') {
                    toggleDrawingTool('text'); // Go back to select tool
                }
                inputArea.remove();
            });
        }
        
        function placeSymbol(x, y, pageNum, symbol) {
            const isBold = fontBoldBtn.classList.contains('active');
            const textData = {
                type: 'text',
                text: symbol,
                x: x / currentScale,
                y: y / currentScale,
                font: fontSelect.value,
                size: parseFloat(fontSizeSelect.value),
                color: fontColor.value,
                fontWeight: isBold ? 'bold' : 'normal'
            };
            pdfPageData[pageNum].drawings.push(textData);
            historyStack.push({ actionType: 'addDrawing', pageNum });
            updateUndoButtonState();
            redrawPageCanvas(pageNum);
        
            punctuationSelect.selectedIndex = 0;
            toggleDrawingTool('select', true);
        }


        function handleImageFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    pendingImage = img;
                    toggleDrawingTool('image-placement', true);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            imageInput.value = '';
        }

        function placeImage(x, y, pageNum) {
            const defaultWidth = 150 / currentScale;
            const aspectRatio = pendingImage.height / pendingImage.width;

            const imageData = {
                type: 'image',
                imageObject: pendingImage,
                x: x / currentScale, y: y / currentScale,
                w: defaultWidth,
                h: defaultWidth * aspectRatio,
            };

            pdfPageData[pageNum].drawings.push(imageData);
            historyStack.push({ actionType: 'addDrawing', pageNum });
            updateUndoButtonState();
            redrawPageCanvas(pageNum);

            pendingImage = null;
            toggleDrawingTool('image-placement');
        }

        function hitTest(x, y, pageNum) {
            if (!pdfPageData[pageNum]) return null;
            const drawings = pdfPageData[pageNum].drawings;
            const scaledX = x / currentScale;
            const scaledY = y / currentScale;
            const buffer = 5 / currentScale;

            for (let i = drawings.length - 1; i >= 0; i--) {
                const obj = drawings[i];

                if (obj.type === 'image') {
                    const handleSize = 10 / currentScale;
                    const handleX = obj.x + obj.w;
                    const handleY = obj.y + obj.h;
                    if (Math.abs(scaledX - handleX) < handleSize && Math.abs(scaledY - handleY) < handleSize) {
                        return {obj, index: i, pageNum, handle: 'resize'};
                    }
                }

                switch(obj.type) {
                    case 'rect':
                    case 'fill-rect':
                    case 'rounded-rect':
                    case 'image':
                        if (scaledX >= obj.x && scaledX <= obj.x + obj.w && scaledY >= obj.y && scaledY <= obj.y + obj.h) return {obj, index: i, pageNum};
                        break;
                    case 'ellipse':
                        const p = Math.pow((scaledX - obj.x), 2) / Math.pow(obj.rx, 2) + Math.pow((scaledY - obj.y), 2) / Math.pow(obj.ry, 2);
                        if (p <= 1) return {obj, index: i, pageNum};
                        break;
                    case 'line':
                    case 'arrow':
                        const distSq = (px, py, x1, y1, x2, y2) => {
                            let l2 = (x2 - x1)**2 + (y2 - y1)**2;
                            if (l2 === 0) return (px - x1)**2 + (py - y1)**2;
                            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
                            t = Math.max(0, Math.min(1, t));
                            return (px - (x1 + t * (x2 - x1)))**2 + (py - (y1 + t * (y2 - y1)))**2;
                        };
                        if (distSq(scaledX, scaledY, obj.x1, obj.y1, obj.x2, obj.y2) < buffer**2) return {obj, index: i, pageNum};
                        break;
                    case 'text':
                         const tempCtxForText = document.createElement('canvas').getContext('2d');
                         tempCtxForText.font = `${obj.fontWeight || 'normal'} ${obj.size}px ${obj.font}`;
                         const textMetrics = tempCtxForText.measureText(obj.text);
                         const textWidth = textMetrics.width;
                         const textHeight = obj.size * 1.2;
                         if (scaledX >= obj.x && scaledX <= obj.x + textWidth && scaledY >= obj.y && scaledY <= obj.y + textHeight) return {obj, index: i, pageNum};
                        break;
                }
            }
            return null;
        }
        
        function handlePreviewKeyDown(e) {
            if (previewModalOverlay.style.display !== 'flex') return;

            if (document.activeElement.tagName === 'INPUT') return;

            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (currentPreviewPage > 1) {
                    setActivePreviewPage(currentPreviewPage - 1);
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                const totalPages = Object.keys(pdfPageData).length;
                if (currentPreviewPage < totalPages) {
                    setActivePreviewPage(currentPreviewPage + 1);
                }
            }
        }

        function handleGlobalKeyDown(e) {
            if (spinnerOverlay.style.display === 'flex' || previewModalOverlay.style.display === 'flex' || exportModalOverlay.style.display === 'flex') return;
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT' || activeEl.isContentEditable)) {
                return;
            }

            if (e.shiftKey) {
                switch(e.key) {
                    case 'ArrowRight':
                        e.preventDefault();
                        if (!nextResultBtn.disabled) navigateToNextResult();
                        return;
                    case 'ArrowLeft':
                        e.preventDefault();
                        if (!prevResultBtn.disabled) navigateToPrevResult();
                        return;
                    case 'R':
                    case 'r':
                        e.preventDefault();
                        if (!replaceNextBtn.disabled) replaceNext();
                        return;
                }
            }

            if (!selectedObject) return;

            const { obj, pageNum, index } = selectedObject;

            if (e.key === 'Delete' || e.key === 'Backspace') {
                e.preventDefault();

                historyStack.push({ actionType: 'deleteDrawing', pageNum, index, deletedObject: obj });
                updateUndoButtonState();

                pdfPageData[pageNum].drawings.splice(index, 1);

                document.getElementById('resize-handle-div')?.remove();
                redrawPageCanvas(pageNum);
                selectedObject = null;
            } else if (e.key.startsWith('Arrow')) {
                e.preventDefault();
                const moveAmount = e.shiftKey ? 10 / currentScale : 2 / currentScale;

                const oldState = 'x' in obj ? { x: obj.x, y: obj.y } : { x1: obj.x1, y1: obj.y1, x2: obj.x2, y2: obj.y2 };

                if ('x' in obj) {
                    if (e.key === 'ArrowUp') obj.y -= moveAmount;
                    else if (e.key === 'ArrowDown') obj.y += moveAmount;
                    else if (e.key === 'ArrowLeft') obj.x -= moveAmount;
                    else if (e.key === 'ArrowRight') obj.x += moveAmount;
                } else {
                    if (e.key === 'ArrowUp') { obj.y1 -= moveAmount; obj.y2 -= moveAmount; }
                    else if (e.key === 'ArrowDown') { obj.y1 += moveAmount; obj.y2 += moveAmount; }
                    else if (e.key === 'ArrowLeft') { obj.x1 -= moveAmount; obj.x2 -= moveAmount; }
                    else if (e.key === 'ArrowRight') { obj.x1 += moveAmount; obj.x2 += moveAmount; }
                }

                historyStack.push({ actionType: 'moveDrawing', pageNum, index, oldState });
                updateUndoButtonState();
                redrawPageCanvas(pageNum);
                if (obj.type === 'image') {
                    document.getElementById('resize-handle-div')?.remove();
                    createResizeHandle(selectedObject);
                }
            }
        }
        
        function toggleFontColorControls() {
            const isDisabled = autoColorDetect.checked;
            fontColor.disabled = isDisabled;
            fontColorPickerBtn.disabled = isDisabled;
            fontColorGroup.classList.toggle('disabled-group', isDisabled);
        }

        function initializeApp() {
            const fontSizeFragment = document.createDocumentFragment();
            for (let i = 2; i <= 100; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                if (i === 14) option.selected = true;
                fontSizeFragment.appendChild(option);
            }
            fontSizeSelect.appendChild(fontSizeFragment);
            
            importFileBtn.addEventListener('click', () => fileInput.click());
            importFileBtnInPanel.addEventListener('click', () => fileInput.click());

            clearBtn.addEventListener('click', clearSearch);
            undoBtn.addEventListener('click', undoLastAction);
            replaceAllBtn.addEventListener('click', replaceAll);
            replaceNextBtn.addEventListener('click', replaceNext);
            prevResultBtn.addEventListener('click', navigateToPrevResult);
            nextResultBtn.addEventListener('click', navigateToNextResult);
            
            fontBoldBtn.addEventListener('click', () => {
                fontBoldBtn.classList.toggle('active');
            });
            
            autoColorDetect.addEventListener('change', toggleFontColorControls);

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFile(e.target.files[0]);
            });
            imageInput.addEventListener('change', handleImageFile);

            searchText.addEventListener('input', findAndHighlightAll);

            pdfViewer.addEventListener('mousedown', handleMouseDown);
            pdfViewer.addEventListener('mousemove', handleMouseMove);
            pdfViewer.addEventListener('dblclick', handleDoubleClick);

            scrollableContent.addEventListener('scroll', onScrollViewerScroll);
            
            zoomInBtn.addEventListener('click', async () => { if (!zoomInBtn.disabled) { currentScale = Math.min(5.0, currentScale + 0.2); await renderAllPages(); findAndHighlightAll(); }});
            zoomOutBtn.addEventListener('click', async () => { if (!zoomOutBtn.disabled && currentScale > 0.4) { currentScale = Math.max(0.4, currentScale - 0.2); await renderAllPages(); findAndHighlightAll(); } });
            fitPageBtn.addEventListener('click', async () => {
                if (!fitPageBtn.disabled) {
                    await setPageScale('page');
                    await renderAllPages();
                    findAndHighlightAll();
                }
            });

            themeToggle.addEventListener('change', () => {
                document.body.classList.toggle('dark-mode');
            });

            openExportModalBtn.addEventListener('click', () => {
                if (Object.keys(pdfPageData).length === 0) return;
                const totalPages = Object.keys(pdfPageData).length;
                totalPagesInModal.textContent = totalPages;
                pageRangeStart.max = totalPages;
                pageRangeEnd.max = totalPages;
                pageRangeStart.value = 1;
                pageRangeEnd.value = totalPages;
                exportModalOverlay.style.display = 'flex';
            });
            closeExportModalBtn.addEventListener('click', () => {
                exportModalOverlay.style.display = 'none';
            });
             exportPdfBtn.addEventListener('click', () => {
                exportModalOverlay.style.display = 'none';
                exportPDF();
            });
            exportPngZipBtn.addEventListener('click', () => {
                exportModalOverlay.style.display = 'none';
                exportPNGZip();
            });

            rangeAll.addEventListener('change', () => {
                pageRangeStart.disabled = true;
                pageRangeEnd.disabled = true;
            });
            rangeCustom.addEventListener('change', () => {
                pageRangeStart.disabled = false;
                pageRangeEnd.disabled = false;
            });
            
            previewBtn.addEventListener('click', () => showPreview());
            closePreviewModalBtn.addEventListener('click', () => {
                previewModalOverlay.style.display = 'none';
                window.removeEventListener('keydown', handlePreviewKeyDown);
                renderAllPages().then(findAndHighlightAll);
            });

            previewZoomInBtn.addEventListener('click', () => {
                previewZoom = Math.min(3.0, previewZoom + 0.1);
                applyPreviewZoom();
            });
            previewZoomOutBtn.addEventListener('click', () => {
                previewZoom = Math.max(minPreviewZoom, previewZoom - 0.1);
                applyPreviewZoom();
            });
            previewFitPageBtn.addEventListener('click', () => {
                const container = previewImageContainer;
                if (!previewMainImage || !container || !previewMainImage.naturalWidth) return;
                
                container.scrollTop = 0;
                container.scrollLeft = 0;

                const containerHeight = container.clientHeight - 20;
                const containerWidth = container.clientWidth - 20;
                const imageWidth = previewMainImage.naturalWidth;
                const imageHeight = previewMainImage.naturalHeight;
                
                if (imageHeight <= 0 || imageWidth <= 0) return;

                const zoomRatio = Math.min(containerWidth / imageWidth, containerHeight / imageHeight);
                previewZoom = Math.min(1.0, zoomRatio);
                applyPreviewZoom();
            });
            previewPrevPageBtn.addEventListener('click', () => {
                 if (currentPreviewPage > 1) setActivePreviewPage(currentPreviewPage - 1);
            });
            previewNextPageBtn.addEventListener('click', () => {
                if (currentPreviewPage < Object.keys(pdfPageData).length) setActivePreviewPage(currentPreviewPage + 1);
            });

            previewImageContainer.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();

                    const rect = previewImageContainer.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const contentX = previewImageContainer.scrollLeft + mouseX;
                    const contentY = previewImageContainer.scrollTop + mouseY;

                    const imageX = contentX / previewZoom;
                    const imageY = contentY / previewZoom;

                    const zoomFactor = 0.1;
                    if (e.deltaY < 0) {
                        previewZoom = Math.min(3.0, previewZoom * (1 + zoomFactor));
                    } else {
                        previewZoom = Math.max(minPreviewZoom, previewZoom / (1 + zoomFactor));
                    }

                    applyPreviewZoom();

                    const newContentX = imageX * previewZoom;
                    const newContentY = imageY * previewZoom;

                    previewImageContainer.scrollLeft = newContentX - mouseX;
                    previewImageContainer.scrollTop = newContentY - mouseY;
                }
            }, { passive: false });
            
            fontColorPickerBtn.addEventListener('click', () => toggleColorPickerMode('font'));
            bgColorPickerBtn.addEventListener('click', () => toggleColorPickerMode('bg'));

            drawingTools.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tool = btn.id.replace('tool-', '');
                    toggleDrawingTool(tool);
                });
            });
            
            punctuationSelect.addEventListener('change', () => {
                if (punctuationSelect.value) {
                    toggleDrawingTool('text', true);
                }
            });

            window.addEventListener('keydown', handleGlobalKeyDown);

            // --- New Listeners for Preview Modal ---
            const thumbnailContainer = document.getElementById('previewThumbnailContainer');
            let draggedItem = null;

            thumbnailContainer.addEventListener('dragstart', e => {
                draggedItem = e.target;
                setTimeout(() => e.target.classList.add('dragging'), 0);
            });

            thumbnailContainer.addEventListener('dragend', e => {
                if (draggedItem) {
                    draggedItem.classList.remove('dragging');
                }
                draggedItem = null;
            });
            
             thumbnailContainer.addEventListener('dragover', e => {
                e.preventDefault();
                const afterElement = [...thumbnailContainer.querySelectorAll('.preview-thumbnail:not(.dragging)')].reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = e.clientY - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;

                document.querySelectorAll('.preview-thumbnail.drag-over').forEach(el => el.classList.remove('drag-over'));
                if (afterElement) {
                    afterElement.classList.add('drag-over');
                }
            });
            
            thumbnailContainer.addEventListener('dragleave', e => {
                 if (e.target.classList.contains("preview-thumbnail")) {
                    e.target.classList.remove('drag-over');
                }
            });

            thumbnailContainer.addEventListener('drop', e => {
                e.preventDefault();
                const dropTarget = document.querySelector('.preview-thumbnail.drag-over');
                if (dropTarget) dropTarget.classList.remove('drag-over');
                
                if (draggedItem) {
                    const targetElement = e.target.closest('.preview-thumbnail');
                    if (!targetElement && !dropTarget) { // Dropped in an empty area
                         thumbnailContainer.appendChild(draggedItem);
                    } else {
                         const referenceNode = dropTarget || targetElement;
                         thumbnailContainer.insertBefore(draggedItem, referenceNode);
                    }
                   
                    const pagesArray = Array.from(thumbnailContainer.children).map(thumb => {
                         const oldPageNum = parseInt(thumb.dataset.pageNum);
                         return Object.values(pdfPageData).find(p => p.pageRef.pageNumber === oldPageNum);
                     });
                     
                    const newPdfData = {};
                    const newThumbOrder = Array.from(thumbnailContainer.children).map(el => parseInt(el.dataset.pageNum));
                    const originalPages = Object.values(pdfPageData);
                    const reorderedPages = newThumbOrder.map(pageNum => originalPages[pageNum-1]);


                    pdfPageData = rekeyPdfPageData(reorderedPages);
                    
                    showPreview(Array.from(thumbnailContainer.children).indexOf(draggedItem) + 1);
                }
            });

            previewDeletePageBtn.addEventListener('click', async () => {
                const totalPages = Object.keys(pdfPageData).length;
                if (totalPages <= 1) {
                    alert('PDF至少需要保留一頁。');
                    return;
                }
                if (confirm(`您確定要刪除第 ${currentPreviewPage} 頁嗎？`)) {
                    let pagesArray = Object.values(pdfPageData);
                    pagesArray.splice(currentPreviewPage - 1, 1);
                    
                    pdfPageData = rekeyPdfPageData(pagesArray);

                    const newActivePage = Math.min(currentPreviewPage, Object.keys(pdfPageData).length);
                    await showPreview(newActivePage);
                }
            });
            
            movePageBtn.addEventListener('click', () => {
                const fromPage = parseInt(movePageFrom.value);
                const toPage = parseInt(movePageTo.value);
                const totalPages = Object.keys(pdfPageData).length;

                if (isNaN(fromPage) || isNaN(toPage) || fromPage < 1 || fromPage > totalPages || toPage < 1 || toPage > totalPages) {
                    alert('請輸入有效的頁碼範圍 (1 到 ' + totalPages + ')。');
                    return;
                }
                if (fromPage === toPage) return;

                let pagesArray = Object.values(pdfPageData);
                const fromIndex = fromPage - 1;
                const toIndex = toPage - 1;

                const [movedPage] = pagesArray.splice(fromIndex, 1);
                pagesArray.splice(toIndex, 0, movedPage);

                pdfPageData = rekeyPdfPageData(pagesArray);
                showPreview(toPage);
            });

            previewInsertPdfBtn.addEventListener('click', () => insertPdfInput.click());
            insertPdfInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const totalPages = Object.keys(pdfPageData).length;
                const insertAfterPageStr = prompt(`請輸入要將新PDF插入在哪一頁之後？\n(輸入 0 表示插入到最前面，輸入 ${currentPreviewPage} 表示插入在目前選定頁之後)`, currentPreviewPage);
                const insertAfterPage = parseInt(insertAfterPageStr);

                if (insertAfterPageStr === null) { insertPdfInput.value = ''; return; }
                if (isNaN(insertAfterPage) || insertAfterPage < 0 || insertAfterPage > totalPages) {
                    alert('輸入的頁碼無效。');
                    insertPdfInput.value = '';
                    return;
                }
                
                showSpinner('正在插入新的 PDF...');
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const newDoc = await pdfjsLib.getDocument({data: arrayBuffer, isEvalSupported: false}).promise;
                    
                    let newPages = [];
                    await processAllPages(newDoc, 0, newPages);

                    let pagesArray = Object.values(pdfPageData);
                    pagesArray.splice(insertAfterPage, 0, ...newPages);
                    
                    pdfPageData = rekeyPdfPageData(pagesArray);
                    
                    await renderAllPages();
                    await showPreview(insertAfterPage + 1);

                } catch (error) {
                    console.error('插入PDF失敗:', error);
                    alert('插入PDF失敗: ' + error.message);
                } finally {
                    hideSpinner();
                    insertPdfInput.value = '';
                }
            });



            const primary = document.createElement('div');
            primary.className = 'primary-toolbar';
            const controls = document.getElementById('controlsContainer');
            controls.insertBefore(primary, document.getElementById('searchReplacePanel'));
            for (const el of [importFileBtnInPanel, document.querySelector('.zoom-group'), pageIndicator, previewBtn, undoBtn, openExportModalBtn]) primary.appendChild(el);
            for (const button of document.querySelectorAll('button[title]')) button.setAttribute('aria-label', button.title);
            const hint = document.createElement('span');
            hint.className = 'toolbar-label'; hint.textContent = '搜尋與替換';
            document.getElementById('searchReplacePanel').prepend(hint);
            replaceNextBtn.textContent = '替換此項';
            document.querySelector('.action-buttons-group').insertBefore(replaceNextBtn, replaceAllBtn);
            clearBtn.textContent = '清除搜尋';
            document.querySelector('.theme-switch').setAttribute('aria-label','切換深色模式');
            window.addEventListener('beforeunload', e => { if (historyStack.length) { e.preventDefault(); e.returnValue = ''; } });
            window.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && !document.activeElement.isContentEditable && previewModalOverlay.style.display !== 'flex') {
                    e.preventDefault(); if (!undoBtn.disabled) undoLastAction();
                }
            });

            toggleFontColorControls();
            resetTool(true);
        }
        initializeApp();
        // Keyboard dialog navigation and accessible names.
        for (const overlay of [exportModalOverlay, previewModalOverlay]) {
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');
            overlay.setAttribute('aria-label', overlay === exportModalOverlay ? '匯出副本' : '頁面管理');
            overlay.addEventListener('keydown', e => {
                if (e.key === 'Escape' && spinnerOverlay.style.display !== 'flex') {
                    e.preventDefault();
                    (overlay === exportModalOverlay ? closeExportModalBtn : closePreviewModalBtn).click();
                }
                if (e.key !== 'Tab') return;
                const focusable = [...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled):not([type=hidden]),select:not(:disabled)')].filter(el => el.getClientRects().length);
                if (!focusable.length) return;
                const first=focusable[0], last=focusable.at(-1);
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            });
        }
        openExportModalBtn.addEventListener('click', () => closeExportModalBtn.focus());
        closeExportModalBtn.addEventListener('click', () => openExportModalBtn.focus());
        closePreviewModalBtn.addEventListener('click', () => previewBtn.focus());
        // Readjust fit-to-width after the window changes, debounced to avoid repeated renders.
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer=setTimeout(async () => {
                if (!Object.keys(pdfPageData).length || spinnerOverlay.style.display === 'flex') return;
                await setPageScale('width'); await renderAllPages(); findAndHighlightAll();
            }, 250);
        });

    </script>
</body>
