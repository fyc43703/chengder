<!doctype html>
<html lang="zh-Hant">
<head>

  <title>我的記事簿</title>
  <meta name="description" content="依日期整理記事、附件與 Google Drive 同步">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231c59bf'/%3E%3Cpath d='M18 15h22l7 7v27H18z' fill='white'/%3E%3Cpath d='M24 30h17M24 38h17M24 46h11' stroke='%231c59bf' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f3f6fb;color:#1d2b44;font:16px/1.5 Arial,'Microsoft JhengHei',sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#fff;padding:26px 18px;border-right:1px solid #e3e9f2}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;color:#153c7a;margin:0 7px 38px}.logo{width:34px;height:34px;border-radius:10px;background:#2563c8;color:white;display:grid;place-items:center}.nav a{display:flex;gap:11px;align-items:center;color:#56647b;text-decoration:none;padding:11px 12px;border-radius:10px;margin:4px 0;font-weight:600}.nav a.active{background:#e7f0ff;color:#1755af}.mini{margin:35px 7px 0;padding:16px;background:#f7f9fd;border-radius:14px}.mini b{display:block;font-size:13px;margin-bottom:10px}.drive{font-size:12px;color:#65738c;margin:5px 0 13px}.connect{border:1px solid #bfd2f5;background:white;color:#1755af;border-radius:8px;font-weight:bold;padding:8px 10px;width:100%;cursor:pointer}.main{padding:30px clamp(20px,4vw,58px);max-width:1440px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.topbar h1{font-size:27px;margin:0}.topbar p{margin:3px 0 0;color:#6c7890;font-size:14px}.search{border:1px solid #dce3ee;background:#fff;border-radius:10px;padding:11px 14px;width:280px;font-size:14px}.content{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.calendar-card,.agenda{background:#fff;border:1px solid #e3e9f2;border-radius:16px;box-shadow:0 8px 28px rgba(35,55,90,.05)}.cal-head{display:flex;justify-content:space-between;align-items:center;padding:21px 24px;border-bottom:1px solid #edf0f5}.cal-head h2{margin:0;font-size:19px}.arrow{border:0;background:#f3f6fb;color:#31578e;border-radius:8px;font-size:18px;width:34px;height:34px;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week{padding:17px 18px 7px;color:#8390a4;font-size:12px;text-align:center;font-weight:bold}.days{padding:0 18px 20px}.day{height:112px;border:1px solid #edf0f5;padding:8px;cursor:pointer;transition:.15s}.day:hover{background:#f8fbff}.day.empty{background:#fbfcfe;cursor:default}.date{font-size:13px;font-weight:bold;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%}.today .date{background:#2363c9;color:#fff}.selected{background:#f1f6ff;outline:2px solid #9fc2f6;outline-offset:-2px}.event{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px;padding:3px 5px;border-radius:4px;font-weight:600}.red{background:#ffe2e4;color:#ba2d3f}.amber{background:#fff0d3;color:#9b6210}.blue{background:#dfeeff;color:#2161ad}.green{background:#dff5eb;color:#15734c}.agenda{padding:22px}.agenda h2{font-size:18px;margin:0}.date-label{color:#6a7890;font-size:13px;margin:3px 0 22px}.add{width:100%;background:#2463c7;color:#fff;border:0;border-radius:9px;padding:11px;font-weight:bold;cursor:pointer;font-size:14px}.note{padding:15px 0;border-bottom:1px solid #edf0f5}.note:last-child{border:0}.note-top{display:flex;align-items:center;gap:8px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#ed5863}.dot.amber{background:#e9a23a}.dot.blue{background:#438be0}.note small{color:#7b8799;display:block;margin:4px 0 7px}.tags span{font-size:11px;border-radius:12px;padding:3px 7px;background:#f0f4f9;color:#5e6c82;margin-right:4px}.attachment{font-size:12px;color:#346bb7;margin-top:8px}.drive-path{background:#eff6ff;border-radius:9px;padding:10px;color:#245da9;font-size:12px;margin-top:22px}.legend{display:flex;gap:13px;flex-wrap:wrap;padding:0 24px 20px;color:#65738c;font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.modal{position:fixed;inset:0;background:rgba(16,31,55,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.dialog{background:#fff;border-radius:16px;width:min(590px,100%);padding:25px;box-shadow:0 16px 60px rgba(18,38,70,.22)}.dialog h2{margin:0 0 4px}.dialog p{color:#6d7990;font-size:14px;margin:0 0 18px}.field{margin:13px 0}.field label{font-size:13px;font-weight:bold;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #dbe3ef;border-radius:8px;padding:10px;font:inherit}.field textarea{height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 150px;gap:12px}.drop{border:1px dashed #aebfd8;background:#f8fbff;padding:12px;border-radius:9px;font-size:13px;color:#5272a0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.cancel{border:0;background:#eef2f7;border-radius:8px;padding:10px 15px;cursor:pointer}.save{border:0;background:#2463c7;color:#fff;border-radius:8px;padding:10px 15px;font-weight:bold;cursor:pointer}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#173969;color:#fff;padding:10px 16px;border-radius:9px;display:none;font-size:14px;z-index:8}.toast.show{display:block}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{grid-template-columns:1fr}.agenda{order:-1}.day{height:82px}.topbar{align-items:flex-start;flex-direction:column}.search{width:100%}}@media(max-width:560px){.main{padding:18px 12px}.days{padding:0 8px 12px}.week{padding-left:8px;padding-right:8px}.day{padding:4px;height:69px}.event{font-size:9px}.row{grid-template-columns:1fr}.cal-head{padding:16px}}
  </style>
<style>
  /* 版面重整：功能列置於標題下方，當日行程固定在月曆左側。 */
  .app { display:block !important; min-height:100vh; }
  .sidebar { display:none !important; }
  .main { max-width:none !important; padding:18px clamp(18px,3vw,48px) 30px !important; }
  .topbar { position:relative !important; display:flex !important; justify-content:center !important; align-items:center !important; min-height:52px !important; margin:0 0 10px !important; }
  .topbar h1 { position:static !important; transform:none !important; width:auto !important; margin:0 auto !important; text-align:center !important; }
  .search-wrap { position:absolute; right:0; top:0; margin:0 !important; width:min(350px,30vw) !important; }
  .notebook-toolbar { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:0 auto 18px; padding:10px 14px; border:1px solid rgba(210,223,239,.9); border-radius:14px; background:rgba(255,255,255,.75); box-shadow:0 8px 22px rgba(37,51,80,.08); }
  .notebook-toolbar .nav { display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap; }
  .notebook-toolbar .nav a { margin:0; padding:9px 13px; font-size:14px; white-space:nowrap; }
  .notebook-toolbar .mini { display:flex; align-items:center; gap:9px; margin:0; padding:0 0 0 14px; border-left:1px solid #dce5f0; border-radius:0; background:transparent; box-shadow:none; }
  .notebook-toolbar .mini b { display:none; }
  .notebook-toolbar .drive { margin:0; white-space:nowrap; }
  .notebook-toolbar .connect { width:auto; padding:8px 12px; white-space:nowrap; }
  .content { grid-template-columns:320px minmax(0,1fr) !important; gap:24px !important; align-items:start; }
  .agenda { grid-column:1; grid-row:1; order:initial !important; min-height:420px; }
  .calendar-card { grid-column:2; grid-row:1; }
  .sidebar-toggle, .agenda-toggle { display:none !important; }
  @media (max-width:1050px) { .search-wrap { position:static; width:min(100%,350px) !important; margin-left:18px !important; } .topbar { justify-content:space-between !important; } .topbar h1 { margin:0 !important; } }
  @media (max-width:900px) { .content { grid-template-columns:1fr !important; } .agenda, .calendar-card { grid-column:1; } .agenda { grid-row:1; } .calendar-card { grid-row:2; } .notebook-toolbar .mini { border-left:0; padding-left:0; } }
  @media (max-width:620px) { .topbar { flex-direction:column; gap:10px; } .search-wrap { width:100% !important; margin:0 !important; } .notebook-toolbar { align-items:stretch; } .notebook-toolbar .nav { justify-content:flex-start; } }
</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const topbar = document.querySelector('.topbar');
    const nav = document.querySelector('.sidebar .nav');
    const drive = document.querySelector('.sidebar .mini');
    if (!topbar || !nav) return;
    const toolbar = document.createElement('section');
    toolbar.className = 'notebook-toolbar';
    toolbar.setAttribute('aria-label', '記事簿功能');
    topbar.insertAdjacentElement('afterend', toolbar);
    toolbar.append(nav);
    if (drive) toolbar.append(drive);

    const labels = ['日曆', '搜尋記事', '我的附件', '設定'];
    const icons = [
      '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="calG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24c6ff"/><stop offset="1" stop-color="#4b4ee8"/></linearGradient></defs><rect x="6" y="9" width="36" height="33" rx="8" fill="url(#calG)"/><path d="M14 6v8m20-8v8M7 19h34M15 27h6m6 0h6m-18 8h6m6 0h6" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="searchG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55d6a9"/><stop offset="1" stop-color="#0784c9"/></linearGradient></defs><circle cx="21" cy="21" r="13" fill="url(#searchG)"/><circle cx="21" cy="21" r="7" fill="none" stroke="white" stroke-width="3"/><path d="m31 31 10 10" stroke="#075d9d" stroke-width="5" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="fileG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd765"/><stop offset="1" stop-color="#f26b5a"/></linearGradient></defs><path d="M8 14h13l4 5h15v20a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V19a5 5 0 0 1 5-5Z" fill="url(#fileG)"/><path d="M15 29h18m-18 6h12" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="gearG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd7bff"/><stop offset="1" stop-color="#5a56dc"/></linearGradient></defs><path d="m24 5 3 5 6-1 1 6 6 3-3 5 3 5-6 3-1 6-6-1-3 5-3-5-6 1-1-6-6-3 3-5-3-5 6-3 1-6 6 1 3-5Z" fill="url(#gearG)"/><circle cx="24" cy="24" r="7" fill="white"/><circle cx="24" cy="24" r="3" fill="#6659df"/></svg>'
    ];
    nav.querySelectorAll('a').forEach((item, index) => {
      const label = labels[index] || item.textContent.trim();
      item.innerHTML = `${icons[index] || ''}<span>${label}</span>`;
      item.setAttribute('aria-label', label);
    });

    const agenda = document.querySelector('.agenda');
    const noteList = document.getElementById('noteList');
    if (agenda && noteList && !agenda.querySelector('.agenda-scroll-controls')) {
      const controls = document.createElement('div');
      controls.className = 'agenda-scroll-controls';
      controls.innerHTML = '<button type="button" aria-label="向上捲動">↑</button><button type="button" aria-label="向下捲動">↓</button>';
      const [up, down] = controls.querySelectorAll('button');
      up.addEventListener('click', () => noteList.scrollBy({ top: -180, behavior: 'smooth' }));
      down.addEventListener('click', () => noteList.scrollBy({ top: 180, behavior: 'smooth' }));
      agenda.append(controls);
    }

    const layoutStyle = document.createElement('style');
    layoutStyle.textContent = `
      .notebook-toolbar{display:grid!important;grid-template-columns:1fr auto 1fr;gap:12px;padding:9px 12px!important}
      .notebook-toolbar .nav{grid-column:2;grid-row:1}
      .notebook-toolbar .mini{grid-column:3;grid-row:1;justify-self:end;border-left:1px solid #dce5f0;padding-left:14px!important}
      .notebook-toolbar .nav a{display:flex;align-items:center;gap:8px;padding:8px 14px!important;color:#294b78;transition:transform .18s,box-shadow .18s}
      .notebook-toolbar .nav a:hover{transform:translateY(-2px);box-shadow:0 7px 14px rgba(38,91,171,.16)}
      .notebook-toolbar .nav a svg{width:29px;height:29px;filter:drop-shadow(0 3px 3px rgba(40,73,150,.25));flex:none}
      .notebook-toolbar .nav a span{font-size:15px;font-weight:700}
      .agenda{position:relative!important;height:min(580px,calc(100vh - 188px))!important;min-height:0!important;display:flex!important;flex-direction:column;overflow:hidden!important}
      .agenda #noteList{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 22px 0 0;scrollbar-width:thin;scrollbar-color:#85aef0 #edf3fd}
      .agenda #noteList::-webkit-scrollbar{width:9px}.agenda #noteList::-webkit-scrollbar-track{background:#edf3fd;border-radius:10px}.agenda #noteList::-webkit-scrollbar-thumb{background:linear-gradient(#90c7ff,#706be9);border-radius:10px}
      .agenda .drive-path{flex:0 0 auto;margin-top:12px!important}
      .agenda-scroll-controls{position:absolute;right:8px;top:138px;display:flex;flex-direction:column;gap:6px;z-index:3}
      .agenda-scroll-controls button{width:27px;height:27px;border:0;border-radius:9px;background:linear-gradient(145deg,#e5f2ff,#e8e4ff);color:#315fa6;font-weight:900;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 3px 8px rgba(61,88,160,.16)}
      .agenda-scroll-controls button:hover{filter:brightness(1.04);transform:translateY(-1px)}
      .calendar-card{background:linear-gradient(145deg,rgba(238,246,255,.9),rgba(252,245,255,.9))!important}
      .calendar-card .cal-head{background:linear-gradient(90deg,rgba(220,238,255,.76),rgba(248,236,255,.76));border-radius:16px 16px 0 0}
      .calendar-card .week{background:rgba(231,241,255,.55)}
      #calendar .day:not(.empty){background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(241,247,255,.86))!important}
      #calendar .day:nth-child(7n+1):not(.empty),#calendar .day:nth-child(7n):not(.empty){background:linear-gradient(145deg,rgba(255,247,250,.92),rgba(245,241,255,.88))!important}
      #calendar .day:nth-child(7n+3):not(.empty),#calendar .day:nth-child(7n+5):not(.empty){background:linear-gradient(145deg,rgba(244,251,255,.92),rgba(239,247,255,.88))!important}
      #calendar .day.selected{background:linear-gradient(145deg,#e0efff,#eee8ff)!important}
      @media(max-width:900px){.notebook-toolbar{display:flex!important}.notebook-toolbar .mini{margin-left:auto!important}.agenda{height:520px!important}.agenda-scroll-controls{top:140px}}
      @media(max-width:620px){.notebook-toolbar .mini{width:100%;justify-content:space-between;border-left:0!important;border-top:1px solid #dce5f0;padding:9px 0 0!important}.notebook-toolbar .nav a{padding:7px 9px!important}.notebook-toolbar .nav a svg{width:25px;height:25px}.notebook-toolbar .nav a span{font-size:13px}}
    `;
    document.head.append(layoutStyle);
  });
</script>
</head>
<body><div class="app">
  <aside class="sidebar"><div class="brand"><span class="logo">▤</span>我的記事簿</div><nav class="nav"><a class="active" href="#">▦　日曆</a><a href="#" onclick="showToast('搜尋功能已在右上角啟用')">⌕　搜尋記事</a><a href="#" onclick="showToast('附件會依日期集中管理')">▱　我的附件</a><a href="#" onclick="showToast('設定功能即將提供')">⚙　設定</a></nav><div class="mini"><b>Google Drive</b><div class="drive" id="driveState">尚未連結帳戶</div><button class="connect" onclick="connectDrive()">連結 Google Drive</button></div></aside>
  <main class="main"><header class="topbar"><div><h1>九月 2026</h1><p>用顏色標示重要度，讓一天的準備事項一眼清楚。</p></div><input id="search" class="search" placeholder="搜尋記事、附件或關鍵字…" oninput="searchNotes()"></header>
  <section class="content"><div class="calendar-card"><div class="cal-head"><button class="arrow" aria-label="上個月">‹</button><h2>2026 年 9 月</h2><button class="arrow" aria-label="下個月">›</button></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days" id="calendar"></div><div class="legend"><span><i style="background:#ed5863"></i>重要</span><span><i style="background:#e9a23a"></i>較重要</span><span><i style="background:#438be0"></i>一般</span><span><i style="background:#23a66c"></i>已完成</span></div></div>
  <aside class="agenda"><h2 id="agendaTitle">今日行程</h2><div class="date-label" id="dateLabel">2026 年 9 月 13 日，星期日</div><button class="add" onclick="openEditor()">＋ 新增記事</button><div id="noteList"></div><div class="drive-path">☁ 儲存位置<br><b>Google Drive／我的記事簿／115-09-13</b></div></aside></section></main></div>
  <div class="modal" id="editor"><div class="dialog"><h2>新增記事</h2><p id="editorDate">儲存到民國 115 年 9 月 13 日</p><div class="field"><label>標題</label><input id="title" placeholder="例如：專案進度會議"></div><div class="row"><div class="field"><label>時間</label><input id="time" type="time" value="10:00"></div><div class="field"><label>重要程度</label><select id="priority"><option value="red">重要</option><option value="amber">較重要</option><option value="blue" selected>一般</option></select></div></div><div class="field"><label>會前注意事項</label><textarea id="detail" placeholder="輸入需要準備、確認或提醒自己的事項…"></textarea></div><div class="field"><label>附件</label><div class="drop">📎 選擇 PDF、圖片或文件　<input id="file" type="file" multiple></div></div><div class="modal-actions"><button class="cancel" onclick="closeEditor()">取消</button><button class="save" onclick="saveNote()">儲存記事</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>

    function renderCalendar(){const c=document.getElementById('calendar');c.innerHTML='';for(let i=0;i<2;i++)c.innerHTML+='<div class="day empty"></div>';for(let d=1;d<=30;d++){let ev=(notes[d]||[]).slice(0,2).map(n=>`<div class="event ${n.kind}">${n.title}</div>`).join('');c.innerHTML+=`<div class="day ${d===13?'today':''} ${d===selected?'selected':''}" onclick="pick(${d})"><span class="date">${d}</span>${ev}</div>`}for(let i=0;i<3;i++)c.innerHTML+='<div class="day empty"></div>'}function pick(d){selected=d;renderCalendar();renderAgenda()}function renderAgenda(){document.getElementById('agendaTitle').textContent=selected===13?'今日行程':'當日行程';document.getElementById('dateLabel').textContent=`民國 115 年 9 月 ${selected} 日`;document.getElementById('editorDate').textContent=`儲存到民國 115 年 9 月 ${selected} 日`;let data=notes[selected]||[];document.getElementById('noteList').innerHTML=data.length?data.map(n=>`<article class="note"><div class="note-top"><span class="dot ${n.kind}"></span>${n.title}</div><small>${n.time}　${n.detail||'尚未加入備註'}</small><div class="tags">${n.tags.split('　').map(x=>'<span>'+x+'</span>').join('')}</div>${n.file?'<div class="attachment">📎 '+n.file+'</div>':''}</article>`).join(''):'<p style="color:#7a8799;font-size:14px;margin-top:22px">這天還沒有從 Google 日曆匯入的行程。<br>也可以直接新增記事。</p>';document.querySelector('.drive-path b').textContent=`Google Drive／我的記事簿／115-09-${String(selected).padStart(2,'0')}`}function openEditor(){document.getElementById('editor').classList.add('show')}function closeEditor(){document.getElementById('editor').classList.remove('show')}function saveNote(){let title=document.getElementById('title').value.trim();if(!title){showToast('請先輸入記事標題');return}let files=[...document.getElementById('file').files].map(f=>f.name).join('、');(notes[selected]??=[]).push({title,time:document.getElementById('time').value,kind:document.getElementById('priority').value,detail:document.getElementById('detail').value,file:files,tags:'記事'});closeEditor();renderCalen
