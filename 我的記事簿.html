<style>
  /* 版面重整：功能列置於標題下方，當日行程固定在月曆左側。 */

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const topbar = document.querySelector('.topbar');
    const nav = document.querySelector('.sidebar .nav');
    const drive = document.querySelector('.sidebar .mini');
    if (!topbar || !nav) return;
    const toolbar = document.createElement('section');
    toolbar.className = 'notebook-toolbar';
    toolbar.setAttribute('aria-label', '記事簿功能');
    topbar.insertAdjacentElement('afterend', toolbar);
    toolbar.append(nav);
    if (drive) toolbar.append(drive);

    const labels = ['日曆', '搜尋記事', '我的附件', '設定'];
    const icons = [
      '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="calG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24c6ff"/><stop offset="1" stop-color="#4b4ee8"/></linearGradient></defs><rect x="6" y="9" width="36" height="33" rx="8" fill="url(#calG)"/><path d="M14 6v8m20-8v8M7 19h34M15 27h6m6 0h6m-18 8h6m6 0h6" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="searchG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55d6a9"/><stop offset="1" stop-color="#0784c9"/></linearGradient></defs><circle cx="21" cy="21" r="13" fill="url(#searchG)"/><circle cx="21" cy="21" r="7" fill="none" stroke="white" stroke-width="3"/><path d="m31 31 10 10" stroke="#075d9d" stroke-width="5" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="fileG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd765"/><stop offset="1" stop-color="#f26b5a"/></linearGradient></defs><path d="M8 14h13l4 5h15v20a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V19a5 5 0 0 1 5-5Z" fill="url(#fileG)"/><path d="M15 29h18m-18 6h12" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="gearG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd7bff"/><stop offset="1" stop-color="#5a56dc"/></linearGradient></defs><path d="m24 5 3 5 6-1 1 6 6 3-3 5 3 5-6 3-1 6-6-1-3 5-3-5-6 1-1-6-6-3 3-5-3-5 6-3 1-6 6 1 3-5Z" fill="url(#gearG)"/><circle cx="24" cy="24" r="7" fill="white"/><circle cx="24" cy="24" r="3" fill="#6659df"/></svg>'
    ];
    nav.querySelectorAll('a').forEach((item, index) => {
      const label = labels[index] || item.textContent.trim();
      item.innerHTML = `${icons[index] || ''}<span>${label}</span>`;
      item.setAttribute('aria-label', label);
    });

    const cloudDrive = document.createElement('a');
    cloudDrive.className = 'cloud-drive-shortcut';
    cloudDrive.href = 'https://drive.google.com/drive/u/0/folders/1sy5PoJLoeO5KcGi803230em3M2wE3cXH';
    cloudDrive.target = '_blank'; cloudDrive.rel = 'noopener';
    cloudDrive.title = '開啟我的記事簿雲端硬碟資料夾';
    cloudDrive.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="driveG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20c997"/><stop offset="1" stop-color="#2878e8"/></linearGradient></defs><path d="M17 7h14l10 17H27L17 7Z" fill="url(#driveG)"/><path d="m17 7 10 17L17 41 7 24 17 7Z" fill="#ffcc5c"/><path d="M17 41h20l4-17H27L17 41Z" fill="#5c7cf0"/><path d="M7 24h34" stroke="white" stroke-width="2" opacity=".9"/></svg><span>雲端硬碟</span>';
    nav.append(cloudDrive);

    const connectButton = drive?.querySelector('.connect');
    const driveState = drive?.querySelector('#driveState');
    const updateDrivePrompt = () => connectButton?.classList.toggle('drive-needs-attention', !/已連結/.test(driveState?.textContent || ''));
    updateDrivePrompt();
    if (driveState) new MutationObserver(updateDrivePrompt).observe(driveState, { childList: true, characterData: true, subtree: true });

    const refreshButton = document.querySelector('.calendar-refresh');
    if (refreshButton) {
      refreshButton.title = '匯入目前月份的 Google 日曆行程';
      const importCurrentMonth = refreshButton.onclick;
      refreshButton.onclick = () => {
        if (!/已連結/.test(driveState?.textContent || '')) {
          window.alert('請先確認已連結 Google Drive，才能下載 Google 日曆資訊。');
          return;
        }
        return importCurrentMonth?.();
      };
    }
    document.querySelectorAll('[aria-label]').forEach(item => { if (!item.title) item.title = item.getAttribute('aria-label'); });

    const noteList = document.getElementById('noteList');
    const separateNotes = () => noteList?.querySelectorAll('.note').forEach(note => {
      const detail = note.querySelector('small');
      if (!detail || detail.textContent.trim().length < 74 || note.querySelector('.note-expand')) return;
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'note-expand'; button.textContent = '展開內容';
      detail.insertAdjacentElement('afterend', button);
    });
    if (noteList) {
      separateNotes();
      new MutationObserver(separateNotes).observe(noteList, { childList: true });
      noteList.addEventListener('click', event => {
        const button = event.target.closest('.note-expand');
        if (!button) return;
        const note = button.closest('.note');
        const expanded = note.classList.toggle('expanded');
        button.textContent = expanded ? '收合內容' : '展開內容';
      });
    }

    const layoutStyle = document.createElement('style');
    layoutStyle.textContent = `
      .notebook-toolbar{display:grid!important;grid-template-columns:1fr auto 1fr;gap:12px;padding:9px 12px!important}
      .notebook-toolbar .nav{grid-column:2;grid-row:1}
      .notebook-toolbar .mini{grid-column:3;grid-row:1;justify-self:end;border-left:1px solid #dce5f0;padding-left:14px!important}
      .notebook-toolbar .nav a{display:flex;align-items:center;gap:8px;padding:8px 14px!important;color:#294b78;transition:transform .18s,box-shadow .18s}
      .notebook-toolbar .nav a:hover{transform:translateY(-2px);box-shadow:0 7px 14px rgba(38,91,171,.16)}
      .notebook-toolbar .nav a svg{width:29px;height:29px;filter:drop-shadow(0 3px 3px rgba(40,73,150,.25));flex:none}
      .notebook-toolbar .nav a span{font-size:15px;font-weight:700}
      .notebook-toolbar .cloud-drive-shortcut{display:flex;align-items:center;gap:8px;margin-left:4px;padding:8px 12px;border-radius:10px;color:#245c89;text-decoration:none;font-weight:800;white-space:nowrap}.notebook-toolbar .cloud-drive-shortcut:hover{background:#eaf7f2;transform:translateY(-2px)}.notebook-toolbar .cloud-drive-shortcut svg{width:29px;height:29px;filter:drop-shadow(0 3px 3px rgba(40,73,150,.22))}.notebook-toolbar .cloud-drive-shortcut span{font-size:15px}
      .drive-needs-attention{animation:drivePulse 1.05s ease-in-out infinite;transform-origin:center}@keyframes drivePulse{0%,100%{transform:scale(1);box-shadow:0 7px 16px rgba(43,85,217,.28)}50%{transform:scale(1.07);box-shadow:0 10px 24px rgba(43,85,217,.52)}}
      .agenda{position:relative!important;height:min(580px,calc(100vh - 188px))!important;min-height:0!important;display:flex!important;flex-direction:column;overflow:hidden!important}
      .agenda #noteList{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 8px 0 0;scrollbar-width:thin;scrollbar-color:#85aef0 #edf3fd}
      .agenda #noteList::-webkit-scrollbar{width:9px}.agenda #noteList::-webkit-scrollbar-track{background:#edf3fd;border-radius:10px}.agenda #noteList::-webkit-scrollbar-thumb{background:linear-gradient(#90c7ff,#706be9);border-radius:10px}
      .agenda .drive-path{flex:0 0 auto;margin-top:12px!important}
      .agenda .note{margin:9px 1px!important;padding:11px 12px!important;border:1px solid #dce8fa!important;border-radius:12px;background:linear-gradient(145deg,#fff,#f5f9ff);box-shadow:0 3px 10px rgba(51,84,137,.08)}
      .agenda .note-top{padding-bottom:5px;border-bottom:1px solid #e7eef8}.agenda .note small{display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;line-height:1.55;margin:7px 0!important}
      .agenda .note.expanded small{display:block!important}.agenda .note .tags{margin-top:7px}.note-expand{border:0;background:transparent;color:#356fbe;font-size:12px;font-weight:700;padding:1px 0 3px;cursor:pointer}.note-expand:hover{text-decoration:underline}
      .topbar h1{font-family:Georgia,'DFKai-SB','BiauKai','KaiTi TC',serif!important;color:#1762b6!important;font-weight:700!important;text-shadow:0 1px 0 #fff,0 2px 5px rgba(36,99,190,.16)}
      .calendar-card{background:linear-gradient(145deg,#f5fbff,#fcf8ff)!important}
      .calendar-card .cal-head{padding:8px 18px!important;min-height:58px;background:linear-gradient(90deg,rgba(220,238,255,.76),rgba(248,236,255,.76));border-radius:16px 16px 0 0}
      .calendar-card .cal-head h2{font-size:22px!important;font-weight:900;color:#213754;letter-spacing:.04em}.calendar-card .cal-head .arrow{width:40px;height:40px;font-size:27px!important;font-weight:900;color:#245692;background:linear-gradient(145deg,#fff,#e7f0ff);box-shadow:0 4px 10px rgba(50,90,160,.14)}
      .calendar-scale{font-size:15px!important;font-weight:900!important;color:#314f78!important}.calendar-scale select{font-size:16px!important;font-weight:900!important;padding:7px 11px!important}
      .calendar-card .week{background:#edf6ff}.calendar-card .week span{font-size:15px!important;font-weight:500;color:#48627f}
      .calendar-card .days{grid-auto-rows:minmax(94px,auto)!important;align-items:stretch}.calendar-card .days .day{height:auto!important;min-height:94px}
      #calendar .day:not(.empty){background:linear-gradient(145deg,#fbfdff,#f1f8ff)!important;border-color:#e2edf4!important;color:#364d66;font-family:'Microsoft JhengHei',sans-serif;font-weight:400}
      #calendar .day:nth-child(7n+1):not(.empty),#calendar .day:nth-child(7n):not(.empty){background:linear-gradient(145deg,#fffaff,#faf4fd)!important}
      #calendar .day:nth-child(7n+3):not(.empty),#calendar .day:nth-child(7n+5):not(.empty){background:linear-gradient(145deg,#f8fcff,#edf7fc)!important}
      #calendar .day.selected{background:linear-gradient(145deg,#e7f3ff,#f3ecff)!important}.calendar-card .date{font-weight:400!important;color:#30445d}.calendar-card .lunar-label{font-weight:400!important;color:#8092a7!important}
      .calendar-card .event{font-family:'Microsoft JhengHei',sans-serif!important;font-weight:400!important;letter-spacing:0!important;box-shadow:0 1px 4px rgba(47,88,131,.1)!important}.calendar-card .event.blue{background:#dceaff!important;color:#1b5fa9!important}.calendar-card .event.green{background:#dff7e8!important;color:#197552!important}
      @media(max-width:900px){.notebook-toolbar{display:flex!important}.notebook-toolbar .mini{margin-left:auto!important}.agenda{height:520px!important}}
      @media(max-width:620px){.notebook-toolbar .mini{width:100%;justify-content:space-between;border-left:0!important;border-top:1px solid #dce5f0;padding:9px 0 0!important}.notebook-toolbar .nav a{padding:7px 9px!important}.notebook-toolbar .nav a svg{width:25px;height:25px}.notebook-toolbar .nav a span{font-size:13px}}
    `;
    document.head.append(layoutStyle);
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', () => {

      aiCard.innerHTML = `<h3>AI 助理設定</h3>
          <div class="setting-row">
              <label>Gemini API Key</label>
              <input id="settingGeminiKey" type="password" placeholder="輸入 API 金鑰...">
          </div>
          <small style="margin-top:5px;display:block">請至 Google AI Studio 取得免費金鑰，僅儲存於本機用於自動整理待辦。</small>`;

      settingsGrid.insertBefore(themeCard, settingsGrid.firstChild);
      settingsGrid.appendChild(aiCard);

      const themeSelect = document.getElementById('settingTheme');
      const geminiInput = document.getElementById('settingGeminiKey');

      const readSettings = () => { try { return JSON.parse(localStorage.getItem('notebookSettingsV1') || '{}'); } catch (_) { return {}; } };
      const writeSettings = value => localStorage.setItem('notebookSettingsV1', JSON.stringify({ ...readSettings(), ...value }));

      themeSelect.value = readSettings().theme || 'system';
      geminiInput.value = readSettings().geminiKey || '';

      const applyTheme = () => {
          const theme = readSettings().theme || 'system';
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              document.body.classList.add('dark-mode');
          } else {
              document.body.classList.remove('dark-mode');
          }
      };

      themeSelect.addEventListener('change', () => { writeSettings({ theme: themeSelect.value }); applyTheme(); });
      geminiInput.addEventListener('change', () => { writeSettings({ geminiKey: geminiInput.value.trim() }); });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
      applyTheme();
      
      obs.disconnect(); // 建立完成後解除監聽
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });

  // 立即觸發一次主題判定
  const initTheme = () => {
      const s = JSON.parse(localStorage.getItem('notebookSettingsV1') || '{}');
      if (s.theme === 'dark' || (!s.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.body.classList.add('dark-mode');
      }
  };
  initTheme();


  // === 2. 語音輸入 & 3. AI 待辦事項提取 ===
  const detailField = document.getElementById('detail')?.closest('.field');
  if (detailField) {
      const toolbar = document.createElement('div');
      toolbar.className = 'editor-toolbar';
      detailField.insertBefore(toolbar, document.getElementById('detail'));

      // 🎤 語音輸入按鈕
      const voiceBtn = document.createElement('button');
      voiceBtn.type = 'button';
      voiceBtn.className = 'tool-button';
      voiceBtn.innerHTML = '🎤 語音輸入';
      toolbar.appendChild(voiceBtn);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = true;  // 允許長句辨識
          recognition.interimResults = true; // 即時顯示辨識過程
          recognition.lang = 'zh-TW';
          let isListening = false;
          let finalTranscript = '';

          voiceBtn.onclick = () => {
              if (isListening) {
                  recognition.stop();
                  return;
              }
              finalTranscript = document.getElementById('detail').value;
              if (finalTranscript && !finalTranscript.endsWith('\n')) finalTranscript += '\n';
              recognition.start();
          };

          recognition.onstart = () => {
              isListening = true;
              voiceBtn.innerHTML = '🔴 聆聽中... (點擊停止)';
              voiceBtn.style.color = '#d93025';
              voiceBtn.style.borderColor = '#fad2cf';
          };

          recognition.onresult = (event) => {
              let interimTranscript = '';
              for (let i = event.resultIndex; i < event.results.length; ++i) {
                  if (event.results[i].isFinal) {
                      finalTranscript += event.results[i][0].transcript + '\n';
                  } else {
                      interimTranscript += event.results[i][0].transcript;
                  }
              }
              document.getElementById('detail').value = finalTranscript + interimTranscript;
          };

          recognition.onend = () => {
              isListening = false;
              voiceBtn.innerHTML = '🎤 語音輸入';
              voiceBtn.style.color = '';
              voiceBtn.style.borderColor = '';
          };
          recognition.onerror = (e) => {
              if (e.error !== 'no-speech') window.showToast?.('語音辨識發生錯誤: ' + e.error);
              recognition.stop();
          };
      } else {
          voiceBtn.style.display = 'none'; // 瀏覽器不支援時隱藏
      }

      // ✨ AI 自動整理待辦按鈕
      const aiBtn = document.createElement('button');
      aiBtn.type = 'button';
      aiBtn.className = 'tool-button';
      aiBtn.innerHTML = '✨ AI 自動整理待辦';
      toolbar.appendChild(aiBtn);

      aiBtn.onclick = async () => {
          const ta = document.getElementById('detail');
          const text = ta.value.trim();
          if (!text) {
              window.showToast?.('請先輸入、語音輸入或掃描文字後，再使用 AI 整理');
              return;
          }

          const s = JSON.parse(localStorage.getItem('notebookSettingsV1') || '{}');
          const apiKey = s.geminiKey;
          if (!apiKey) {
              window.showSettings?.(); // 呼叫你原本的設定面板
              window.showToast?.('請先在設定中輸入 Gemini API Key');
              return;
          }

          aiBtn.innerHTML = '⏳ AI 處理中...';
          aiBtn.disabled = true;

          try {
            // 新 API Key 不再提供 Gemini 2.5 Flash；使用 Gemini API 指定的穩定版模型。
            const model = 'gemini-3.6-flash';
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const res = await fetch(endpoint, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      contents: [{
                          parts: [{
                              text: "請將以下紀錄整理成條理分明的「待辦事項清單」，每個待辦事項前面請加上 Markdown 的 Checkbox `[ ]`。若有重要資訊（如時間、地點、決議）請適度保留在待辦清單上方或下方作為一般備註。請直接輸出整理後的結果，不要包含任何開場白。原始文字如下：\n\n" + text
                          }]
                      }]
                  })
              });
              const data = await res.json();
              if (!res.ok || data.error) {
                  const apiMessage = data?.error?.message || `HTTP ${res.status}`;
                  if (res.status === 400 || res.status === 401 || res.status === 403) {
                      throw new Error(`Gemini API Key 無效、未啟用 Gemini API，或沒有存取 ${model} 的權限。${apiMessage}`);
                  }
                  throw new Error(apiMessage);
              }

              const resultText = data?.candidates?.[0]?.content?.parts?.map(part => part.text || '').join('').trim();
              if (!resultText) {
                  throw new Error('Gemini 未傳回可用文字，請稍後再試。');
              }
              ta.value = resultText.trim();
              window.showToast?.('✨ AI 整理完成！');
          } catch (err) {
              window.showToast?.('AI 處理失敗: ' + err.message);
          } finally {
              aiBtn.innerHTML = '✨ AI 自動整理待辦';
              aiBtn.disabled = false;
          }
      };
  }
});
</script>
<style>
  .ai-page{display:none;position:fixed;inset:0;z-index:220;background:rgba(233,240,249,.82);backdrop-filter:blur(9px);padding:4vh 5vw;overflow:auto}
  .ai-page.show{display:block}.ai-panel{position:relative;max-width:1180px;margin:auto;background:#fff;border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(27,54,93,.25)}
  .ai-panel h2{margin:0;color:#174f94}.ai-panel>p{color:#60718a;margin:7px 0 22px}.ai-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.ai-action{border:1px solid #d5e3f6;background:linear-gradient(145deg,#fff,#f2f8ff);border-radius:14px;padding:16px;text-align:left;cursor:pointer;color:#1b477c;font:inherit;font-weight:800}.ai-action span{display:block;color:#6d7d94;font-size:12px;font-weight:400;margin-top:5px;line-height:1.45}.ai-action:hover,.ai-action.active{border-color:#397bd0;background:#e9f3ff;box-shadow:0 6px 16px rgba(30,92,174,.14)}.ai-input{width:100%;min-height:100px;margin-top:18px;border:1px solid #d5e0ee;border-radius:12px;padding:12px;font:inherit;resize:vertical}.ai-controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.ai-run,.ai-copy{border:0;border-radius:9px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer}.ai-run{background:#1767c5;color:#fff}.ai-copy{background:#eaf1fa;color:#29547d}.ai-status{color:#61738d;font-size:13px}.ai-result{display:none;white-space:pre-wrap;margin-top:18px;border-radius:14px;padding:18px;background:#f6faff;border:1px solid #d7e7fa;line-height:1.75;color:#233b59}.ai-result.show{display:block}.ai-limit{margin-top:10px;color:#78879b;font-size:12px}@media(max-width:760px){.ai-page{padding:18px 12px}.ai-panel{padding:22px 16px}.ai-grid{grid-template-columns:1fr}}
</style>
<script>
(() => {
  const features = [
    ['summary','☀️ 今日重點摘要','將所選日期的行程與記事濃縮為重點、優先順序與下一步。'],
    ['meeting','📝 會議紀錄整理','把記事整理為議題、決議、待辦、負責角色與期限。'],
    ['attachment','📎 附件重點擷取','依記事、附件名稱與已擷取文字產生摘要與待確認事項。'],
    ['polish','✍️ 筆記續寫與潤稿','將片段紀錄改寫成條理清楚、可直接使用的正式內容。'],
    ['decision','🧭 決策脈絡整理','從相關記事整理背景、選項、依據、已決議及待決事項。'],
    ['knowledge','📚 個人知識庫摘要','依全部本機記事，建立主題化的知識摘要與快速索引。']
  ];
  let selectedFeature = 'summary';
  const readSettings = () => { try { return JSON.parse(localStorage.getItem('notebookSettingsV1') || '{}'); } catch (_) { return {}; } };
  const esc = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const selectedDate = () => {
    const heading = document.querySelector('.cal-head h2')?.textContent.match(/(\d+)\s*年\s*(\d+)\s*月/);
    const day = document.querySelector('#calendar .day.selected .date')?.textContent;
    return heading && day ? `${heading[1]}-${String(heading[2]).padStart(2,'0')}-${String(day).padStart(2,'0')}` : '';
  };
  const notes = () => { try { return JSON.parse(localStorage.getItem('notebookLedgerV1') || '{}'); } catch (_) { return {}; } };
  const noteText = (items, includeFiles = true) => items.map((item,index) => [`【記事 ${index+1}】`, `標題：${item.title||'未命名'}`, `時間：${item.time||'未設定'}`, item.location ? `地點：${item.location}` : '', `內容：${item.detail||'無'}`, includeFiles && item.file ? `附件：${item.file}` : '', item.tags ? `標籤：${item.tags}` : ''].filter(Boolean).join('\n')).join('\n\n');
  const contextFor = type => {
    const all = notes(), date = selectedDate(), daily = all[date] || [];
    const scope = type === 'decision' || type === 'knowledge' ? Object.entries(all).map(([day, items]) => `【${day}】\n${noteText(items)}`).join('\n\n') : noteText(daily);
    return { date, daily, scope };
  };
  const instructions = {
    summary: '請以繁體中文製作「今日重點摘要」。先列三至五項重點，再列依優先順序排序的待辦與建議下一步。若資料不足，明確標註待確認事項。',
    meeting: '請以繁體中文將內容整理成正式會議紀錄，格式包括：會議主題、討論重點、決議、待辦事項（含建議負責角色與期限）、待確認事項。不得自行虛構事實。',
    attachment: '請以繁體中文摘要附件相關資訊與記事內容，列出：附件清單、已知重點、可能需確認的內容、建議閱讀／處理順序。僅可依提供的文字和檔名推論；若附件沒有可讀文字，請清楚說明無法直接讀取檔案內容。',
    polish: '請以繁體中文潤飾並適度續寫內容，使其結構清楚、語氣專業。保留已知事實，不得杜撰；請輸出可直接貼回記事簿的版本。',
    decision: '請以繁體中文整理決策脈絡：背景、已知事實、討論／選項、已決議、尚未決定、建議下一步。請標註資訊來自哪些日期的記事，且不可虛構。',
    knowledge: '請以繁體中文將資料歸納為個人知識庫：依主題分類，列出每個主題的核心知識、相關日期／記事、常見待辦與待補資料。避免重複並保留可追溯性。'
  };
  const panel = document.createElement('section');
  panel.id = 'aiInsightPage'; panel.className = 'ai-page';
  panel.innerHTML = `<div class="ai-panel"><button class="search-close" type="button" aria-label="關閉 AI 智慧洞察">×</button><h2>✦ AI 智慧洞察</h2><p>以既有 Gemini API Key 分析目前記事；送出前請確認內容可提供給 Gemini。</p><div class="ai-grid">${features.map(([id,name,desc]) => `<button type="button" class="ai-action" data-ai="${id}">${name}<span>${desc}</span></button>`).join('')}</div><textarea class="ai-input" id="aiExtra" placeholder="可補充分析指令，或貼上附件內文；「附件重點擷取」無法直接讀取 PDF／PPT 時尤其適用。"></textarea><div class="ai-controls"><button type="button" class="ai-run">開始 AI 分析</button><button type="button" class="ai-copy">複製結果</button><span class="ai-status"></span></div><div class="ai-result" aria-live="polite"></div><div class="ai-limit">分析範圍：今日類功能使用目前選取日期；「決策脈絡」與「個人知識庫」使用本機快取的全部記事。</div></div>`;
  document.body.appendChild(panel);
  const result = panel.querySelector('.ai-result'), status = panel.querySelector('.ai-status'), run = panel.querySelector('.ai-run');
  const choose = id => { selectedFeature = id; panel.querySelectorAll('.ai-action').forEach(button => button.classList.toggle('active', button.dataset.ai === id)); };
  panel.querySelectorAll('.ai-action').forEach(button => button.addEventListener('click', () => choose(button.dataset.ai)));
  panel.querySelector('.search-close').addEventListener('click', () => panel.classList.remove('show'));
  panel.querySelector('.ai-copy').addEventListener('click', async () => { if (!result.textContent.trim()) return; try { await navigator.clipboard.writeText(result.textContent); status.textContent = '已複製結果'; } catch (_) { status.textContent = '無法自動複製，請手動選取文字'; } });
  run.addEventListener('click', async () => {
    const apiKey = readSettings().geminiKey;
    if (!apiKey) { status.textContent = '請先在「設定」填入 Gemini API Key。'; return; }
    const { date, daily, scope } = contextFor(selectedFeature), extra = panel.querySelector('#aiExtra').value.trim();
    if (!scope.trim() && !extra) { status.textContent = '目前沒有可分析的記事；請選擇含記事的日期或輸入補充文字。'; return; }
    const heading = features.find(item => item[0] === selectedFeature)[1];
    const prompt = `${instructions[selectedFeature]}\n\n功能：${heading}\n${date ? `目前選取日期：${date}` : ''}\n\n【記事資料】\n${scope || '無'}\n\n【使用者補充】\n${extra || '無'}`;
    run.disabled = true; run.textContent = 'AI 分析中…'; status.textContent = '正在分析記事內容…'; result.classList.remove('show');
    try {
      const model = 'gemini-3.6-flash';
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({contents:[{parts:[{text:prompt}]}]}) });
      const data = await response.json();
      if (!response.ok || data.error) throw new Error(data?.error?.message || `HTTP ${response.status}`);
      const text = data?.candidates?.[0]?.content?.parts?.map(part => part.text || '').join('').trim();
      if (!text) throw new Error('Gemini 沒有傳回可用結果。');
      result.textContent = text; result.classList.add('show'); status.textContent = '分析完成';
    } catch (error) { status.textContent = `分析失敗：${error.message}`; }
    finally { run.disabled = false; run.textContent = '開始 AI 分析'; }
  });
  const addNav = () => {
    const nav = document.querySelector('.notebook-toolbar .nav') || document.querySelector('.sidebar .nav');
    if (!nav || document.getElementById('aiInsightNav')) return;
    const link = document.createElement('a'); link.id = 'aiInsightNav'; link.href = '#'; link.title = 'AI 智慧洞察'; link.setAttribute('aria-label','AI 智慧洞察'); link.innerHTML = '<span class="ai-nav-icon">✦</span><span>AI 智慧洞察</span>';
    link.addEventListener('click', event => { event.preventDefault(); choose(selectedFeature); panel.classList.add('show'); }); nav.appendChild(link);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addNav); else addNav();
  const style = document.createElement('style'); style.textContent = '.ai-nav-icon{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,#735ce5,#17a2b8);color:#fff;font-size:20px;box-shadow:0 3px 7px rgba(90,75,190,.28)}'; document.head.appendChild(style);
})();
</script>
</body>
