<script>

    const preferenceStyle = document.createElement('style'); preferenceStyle.textContent = '.hide-lunar .lunar-label{display:none!important}.no-weekend-tint #calendar .day:nth-child(7n+1):not(.empty),.no-weekend-tint #calendar .day:nth-child(7n):not(.empty){background:linear-gradient(145deg,#fbfdff,#f1f8ff)!important}.high-contrast{filter:contrast(1.18)}.color-blind .event.blue{background:#dbeafe!important;color:#174c91!important}.color-blind .event.green{background:#fef3c7!important;color:#8a4b08!important}'; document.head.append(preferenceStyle);

    window.showSettings = openSettings;

    page.querySelector('.settings-close').onclick = () => page.classList.remove('show'); page.addEventListener('click', event => { if (event.target === page) page.classList.remove('show'); });

    $('#settingClearCache').onclick = () => { if (!window.confirm('確定清除本機快取的記事？Google Drive 原始資料不會被刪除。')) return; localStorage.removeItem('notebookLedgerV1'); $('#settingCacheStats').textContent = '目前快取：0 筆記事／0.0 KB'; window.showToast?.('本機快取已清除；重新整理後生效'); };

<script>
document.addEventListener('DOMContentLoaded', () => {
  // === 1. 深色模式與設定面板擴充 ===
  const observer = new MutationObserver((mutations, obs) => {
    const settingsGrid = document.querySelector('.settings-grid');
    if (settingsGrid && !document.getElementById('settingTheme')) {
      // 插入深色模式設定
      const themeCard = document.createElement('article');
      themeCard.className = 'setting-card';
      themeCard.innerHTML = `<h3>主題顯示設定</h3>
          <div class="setting-row">
              <label>深色模式</label>
              <select id="settingTheme">
                  <option value="system">跟隨系統</option>
                  <option value="light">淺色模式</option>
                  <option value="dark">深色模式</option>
              </select>
          </div>`;
      
      // 插入 AI 助理設定
      const aiCard = document.createElement('article');
      aiCard.className = 'setting-card';
      aiCard.innerHTML = `<h3>AI 助理設定</h3>
          <div class="setting-row">
              <label>Gemini API Key</label>
              <input id="settingGeminiKey" type="password" placeholder="輸入 API 金鑰...">
          </div>
          <div class="setting-row" style="margin-top:12px">
              <label>Groq API Key（Gemini 忙碌時自動備援）</label>
              <input id="settingGroqKey" type="password" placeholder="輸入 Groq API 金鑰...">
          </div>
          <small style="margin-top:5px;display:block">金鑰僅儲存於本機。優先使用 Gemini Flash；遇到 429、逾時或伺服器忙碌時，自動改用 Groq 的 GPT-OSS 20B。</small>`;

      settingsGrid.insertBefore(themeCard, settingsGrid.firstChild);
      settingsGrid.appendChild(aiCard);

      const themeSelect = document.getElementById('settingTheme');
      const geminiInput = document.getElementById('settingGeminiKey');
      const groqInput = document.getElementById('settingGroqKey');

      const readSettings = () => { try { return JSON.parse(localStorage.getItem('notebookSettingsV1') || '{}'); } catch (_) { return {}; } };
      const writeSettings = value => localStorage.setItem('notebookSettingsV1', JSON.stringify({ ...readSettings(), ...value }));

      themeSelect.value = readSettings().theme || 'system';
      geminiInput.value = readSettings().geminiKey || '';
      groqInput.value = readSettings().groqKey || '';

      const applyTheme = () => {
          const theme = readSettings().theme || 'system';
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              document.body.classList.add('dark-mode');
          } else {
              document.body.classList.remove('dark-mode');
          }
      };

      themeSelect.addEventListener('change', () => { writeSettings({ theme: themeSelect.value }); applyTheme(); });
      geminiInput.addEventListener('change', () => { writeSettings({ geminiKey: geminiInput.value.trim() }); });
      groqInput.addEventListener('change', () => { writeSettings({ groqKey: groqInput.value.trim() }); });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
      applyTheme();
      
      obs.disconnect(); // 建立完成後解除監聽
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });

  // 立即觸發一次主題判定
  const initTheme = () => {
      const s = JSON.parse(localStorage.getItem('notebookSettingsV1') || '{}');
      if (s.theme === 'dark' || (!s.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.body.classList.add('dark-mode');
      }
  };
  initTheme();

  // Gemini Flash 為預設；僅在限流、逾時或服務端負載異常時，才自動改由 Groq 備援。
  window.notebookAiGenerate = async (prompt, onProgress = () => {}, options = {}) => {
      const settings = JSON.parse(localStorage.getItem('notebookSettingsV1') || '{}');
      const makeError = (message, status = 0) => Object.assign(new Error(message || `HTTP ${status}`), { status });
      const readStream = async (response, getText) => {
          const reader = response.body?.getReader();
          if (!reader) throw makeError('服務未提供可讀取的串流回覆。', response.status);
          const decoder = new TextDecoder();
          let buffer = '', text = '', chunks = 0;
          const consume = event => {
              const payload = event.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trim()).join('');
              if (!payload || payload === '[DONE]') return;
              try {
                  const piece = getText(JSON.parse(payload));
                  if (piece) { text += piece; chunks += 1; onProgress({ stage:'streaming', chunks, chars:text.length, text }); }
              } catch (_) { /* 忽略服務端的非資料 SSE 訊息。 */ }

          const model = 'gemini-3.6-flash';

          const parts = [{ text:prompt }];
          if (options.image?.data && options.image?.mimeType) parts.push({ inline_data:{ mime_type:options.image.mimeType, data:options.image.data } });
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(settings.geminiKey)}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ contents:[{ parts }] }) });

          if (!text) throw makeError('Gemini 沒有傳回可用結果。', response.status);

          const model = 'openai/gpt-oss-20b';

              window.showToast?.('請先輸入、語音輸入或掃描文字後，再使用 AI 整理');

<script>
/* 以標頭資料屬性補強農曆標示，避免民國／西元併列格式影響月份判讀。 */
(() => {
  const paintLunar = () => {
    const heading = document.querySelector('.cal-head h2'), year = Number(heading?.dataset.year), month = Number(heading?.dataset.month);
    if (!year || !month) return;
    document.querySelectorAll('#calendar .day:not(.empty)').forEach(cell => {
      const date = cell.querySelector('.date'); if (!date || cell.querySelector('.lunar-label')) return;
      const day = Number(date.textContent), label = document.createElement('span');
      label.className = 'lunar-label'; label.textContent = new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{month:'short',day:'numeric'}).format(new Date(year, month - 1, day)); date.after(label);
    });
  };
  const calendar = document.getElementById('calendar'); if (calendar) new MutationObserver(() => queueMicrotask(paintLunar)).observe(calendar,{childList:true,subtree:true});
  paintLunar();
})();
</script>
