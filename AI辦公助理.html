<script>window.aiOfficeGenerate = async (prompt, onProgress = () => {}, options = {}) => {
      const settings = JSON.parse(localStorage.getItem('aiOfficeSettingsV1') || '{}');
      const makeError = (message, status = 0) => Object.assign(new Error(message || `HTTP ${status}`), { status });
      const readStream = async (response, getText) => {
          const reader = response.body?.getReader();
          if (!reader) throw makeError('服務未提供可讀取的串流回覆。', response.status);
          const decoder = new TextDecoder();
          let buffer = '', text = '', chunks = 0;
          const consume = event => {
              const payload = event.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trim()).join('');
              if (!payload || payload === '[DONE]') return;
              try {
                  const piece = getText(JSON.parse(payload));
                  if (piece) { text += piece; chunks += 1; onProgress({ stage:'streaming', chunks, chars:text.length, text }); }
              } catch (_) { /* 忽略服務端的非資料 SSE 訊息。 */ }
          };
          while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream:true }).replace(/\r\n/g, '\n');
              let boundary;
              while ((boundary = buffer.indexOf('\n\n')) !== -1) {
                  consume(buffer.slice(0, boundary));
                  buffer = buffer.slice(boundary + 2);
              }
          }
          buffer += decoder.decode();
          if (buffer.trim()) consume(buffer);
          return text.trim();
      };
      const callGemini = async () => {
          const model = 'gemini-3.6-flash';
          onProgress({ stage:'submitting', provider:'Gemini Flash' });
          const parts = [{ text:prompt }];
          if (options.image?.data && options.image?.mimeType) parts.push({ inline_data:{ mime_type:options.image.mimeType, data:options.image.data } });
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(settings.geminiKey)}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ contents:[{ parts }] }) });
          if (!response.ok) { const data = await response.json().catch(() => ({})); throw makeError(data?.error?.message, response.status); }
          const text = await readStream(response, data => data?.candidates?.[0]?.content?.parts?.map(part => part.text || '').join('') || '');
          if (!text) throw makeError('Gemini 沒有傳回可用結果。', response.status);
          return { text, provider:'Gemini Flash', fallback:false };
      };
      const callGroq = async fallback => {
          const model = 'openai/gpt-oss-20b';
          onProgress({ stage:fallback ? 'fallback' : 'submitting', provider:options.image ? 'Groq · OCR 文字備援' : 'Groq · GPT-OSS 20B' });
          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${settings.groqKey}`}, body:JSON.stringify({ model, messages:[{ role:'user', content:prompt }], stream:true }) });
          if (!response.ok) { const data = await response.json().catch(() => ({})); throw makeError(data?.error?.message, response.status); }
          const text = await readStream(response, data => data?.choices?.[0]?.delta?.content || '');
          if (!text) throw makeError('Groq 沒有傳回可用結果。', response.status);
          return { text, provider:options.image ? 'Groq · OCR 文字備援（未進行照片場景判讀）' : 'Groq · GPT-OSS 20B', fallback };
      };
      if (settings.geminiKey) {
          try { return await callGemini(); }
          catch (error) {
              const overloaded = !error.status || [408, 429, 500, 502, 503, 504].includes(error.status);
              if (settings.groqKey && overloaded) return callGroq(true);
              throw error;
          }
      }
      if (settings.groqKey) return callGroq(false);
      throw makeError('請先在頁面上方填入 Gemini 或 Groq API Key。');
  };


  </script>
