<script>
window.aiOfficeGenerate = async (prompt, onProgress = () => {}, options = {}) => {
  let settings;
  try { settings = window.getAiOfficeSettings ? window.getAiOfficeSettings() : JSON.parse(localStorage.getItem('aiOfficeSettingsV1') || '{}'); }
  catch (_) { settings = {}; }
  const makeError = (message, status = 0) => Object.assign(new Error(message || `HTTP ${status}`), { status });
  const readStream = async (response, getText) => {
    const reader = response.body?.getReader();
    if (!reader) throw makeError('服務未提供可讀取的串流回覆。', response.status);
    const decoder = new TextDecoder(); let buffer = '', text = '', chunks = 0;
    const consume = event => {
      const payload = event.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n');
      if (!payload || payload.trim() === '[DONE]') return;
      let data;
      try { data = JSON.parse(payload); } catch (_) { throw makeError('AI 串流資料不完整，請重新分析。'); }
      if (data.error) throw makeError(data.error.message || 'AI 服務回傳串流錯誤。', data.error.code || 0);
      const piece = getText(data);
      if (piece) { text += piece; chunks++; onProgress({ stage:'streaming', chunks, chars:text.length, text }); }
    };
    const drain = final => {
      // Defer a trailing CR until its possible LF arrives in the next network chunk.
      buffer = buffer.replace(/\r\n/g, '\n').replace(final ? /\r/g : /\r(?!$)/g, '\n');
      let boundary;
      while ((boundary = buffer.indexOf('\n\n')) !== -1) { consume(buffer.slice(0, boundary)); buffer = buffer.slice(boundary + 2); }
      if (final && buffer.trim()) { consume(buffer); buffer = ''; }
    };
    try {
      while (true) {
        const { value, done } = await reader.read(); if (done) break;
        buffer += decoder.decode(value, { stream:true }); drain(false);
      }
      buffer += decoder.decode(); drain(true); return text.trim();
    } catch (error) { if (reader.cancel) await reader.cancel().catch(() => {}); throw error; }
    finally { reader.releaseLock?.(); }
  };
  const request = async (url, init, getText) => {
    const controller = new AbortController(); let timedOut = false;
    const abort = () => controller.abort();
    if (options.signal?.aborted) throw new DOMException('已取消分析。', 'AbortError');
    options.signal?.addEventListener('abort', abort, { once:true });
    const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, options.timeoutMs || 180000);
    try {
      const response = await fetch(url, { ...init, signal:controller.signal });
      if (!response.ok) { const data = await response.json().catch(() => ({})); throw makeError(data?.error?.message || 'AI 服務請求失敗。', response.status); }
      const text = await readStream(response, getText); if (!text) throw makeError('AI 沒有傳回可用結果。', response.status);
      return text;
    } catch (error) {
      if (options.signal?.aborted) throw new DOMException('已取消分析。', 'AbortError');
      if (timedOut) throw makeError('AI 服務超過三分鐘未完成，請稍後再試。', 408);
      throw error;
    } finally { clearTimeout(timeout); options.signal?.removeEventListener('abort', abort); }
  };
  const callGemini = async () => {
    const model = 'gemini-3.6-flash'; onProgress({ stage:'submitting', provider:'Gemini Flash' });
    const parts = [{ text:prompt }];
    if (options.image?.data && options.image?.mimeType) parts.push({ inline_data:{ mime_type:options.image.mimeType, data:options.image.data } });
    const text = await request(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key':settings.geminiKey }, body:JSON.stringify({ contents:[{ parts }] })
    }, data => data?.candidates?.[0]?.content?.parts?.filter(part => !part.thought).map(part => part.text || '').join('') || '');
    return { text, provider:'Gemini Flash', fallback:false };
  };
  const callGroq = async fallback => {
    const provider = options.image ? 'Groq · OCR 文字備援（未進行照片場景判讀）' : 'Groq · GPT-OSS 20B';
    onProgress({ stage:fallback ? 'fallback' : 'submitting', provider });
    const text = await request('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${settings.groqKey}` },
      body:JSON.stringify({ model:'openai/gpt-oss-20b', messages:[{ role:'user', content:prompt }], stream:true })
    }, data => data?.choices?.[0]?.delta?.content || '');
    return { text, provider, fallback };
  };
  if (settings.geminiKey) {
    try { return await callGemini(); }
    catch (error) {
      if (error.name === 'AbortError' || options.signal?.aborted) throw error;
      const overloaded = !error.status || [408,429,500,502,503,504].includes(error.status);
      if (settings.groqKey && settings.allowFallback !== false && overloaded) return callGroq(true);
      throw error;
    }
  }
  if (settings.groqKey) return callGroq(false);
  throw makeError('請先在頁面上方填入 Gemini 或 Groq API Key。');
};
</script>

        setProcessing(true, 'AI 正在生成結果', `已接收第 ${progress.chunks} 個文字片段，依目前輸出速度推估中…`);
        setTranscriptionProgress(percent, etaText);
      }, { image:imagePayload, signal:controller.signal });
      setProcessing(true, '正在整理分析結果', '正在將完成內容套用為易讀的 Markdown 格式…');
      setTranscriptionProgress(96, '即將完成');
      await new Promise(resolve => requestAnimationFrame(resolve)); throwIfCancelled(controller.signal);
      const nextResult = feature === 'briefing' ? normaliseBriefingMarkdown(aiResult.text) : aiResult.text; const nextHtml = markdownHtml(nextResult); resultFeature = feature; rawResult = nextResult; sourceText.textContent = originalContent || '（未提供可顯示的原始內容）'; result.classList.toggle('proofread-result', feature === 'proofread'); result.innerHTML = nextHtml; applySemanticColours(); result.classList.add('show'); workspace.classList.add('show'); resultActions.classList.add('show'); setWorkflowStep(4); status.textContent = `分析完成（${aiResult.provider}${aiResult.fallback ? '，已自動備援' : ''}）`;
    } catch (error) { status.textContent = error.name === 'AbortError' ? '已取消分析，原始內容與上一份結果仍保留。' : `分析失敗：${error.message}`; }
    finally { setProcessing(false); setEditingEnabled(true); run.disabled = false; run.textContent = '開始 AI 分析'; }
  });

  normaliseHelpAttributes(panel); normaliseHelpAttributes(transcribePage);

})();
