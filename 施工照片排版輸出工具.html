<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>施工照片排版輸出工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://unpkg.com/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <style>
    :root{color-scheme:light dark;--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dce3ee;--brand:#1769e0;--danger:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Microsoft JhengHei",sans-serif}.app{max-width:1280px;margin:auto;padding:24px}h1{margin:0;font-size:28px}h2{font-size:17px;margin:0 0 12px}.lead{margin:5px 0 22px;color:var(--muted)}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 16px #1822350c}.field{display:grid;gap:6px;margin:10px 0}label{font-weight:650}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:transparent;color:inherit}textarea{min-height:38px;height:38px;resize:vertical;line-height:1.35}button,.button{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}button:hover,.button:hover{filter:brightness(.93)}button:disabled{opacity:.48;cursor:not-allowed}.button.secondary{background:#e8effa;color:#164d96}.button.danger{background:var(--danger)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.hint{font-size:13px;color:var(--muted)}#drop-zone{border:2px dashed #90b9ed;border-radius:12px;padding:18px;text-align:center;color:#315f98;background:#f6faff}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:18px}.photo{overflow:hidden;padding:0}.photo img{display:block;width:100%;height:170px;object-fit:contain;background:#eef2f7}.photo-content{padding:12px}.photo-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.icon-button{padding:6px 9px;font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:15px;box-shadow:0 16px 60px #0005;width:min(92vw,650px);padding:0;color:var(--ink);background:var(--card)}dialog::backdrop{background:#0007}.dialog-body{padding:22px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#0007;z-index:5}.overlay.visible{display:grid}.status{background:var(--card);border-radius:14px;padding:22px;min-width:min(88vw,360px);text-align:center}.spinner{margin:0 auto 12px;width:32px;height:32px;border:4px solid #c8d9f3;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#preview{max-width:92vw;max-height:82vh;background:#fff}.notice{margin:15px 0;padding:10px 13px;border-radius:8px;background:#edf6ff;color:#14508e}.hidden{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#121821;--card:#1d2735;--ink:#edf3fb;--muted:#a8b5c7;--line:#354257}#drop-zone{background:#192b40}.button.secondary{background:#2a3d56;color:#d7e9ff}.notice{background:#173453;color:#cfe8ff}}
  </style>
  <style>
    /* Apple-inspired：柔白玻璃、圓角與低飽和多色光暈 */
    :root{--apple-blue:#007aff;--apple-indigo:#5856d6;--apple-purple:#af52de;--apple-pink:#ff2d55;--apple-orange:#ff9500;--apple-green:#34c759;--apple-ink:#1d1d1f;--apple-secondary:#6e6e73;--apple-surface:rgba(255,255,255,.78)}
    body{min-height:100vh;background:radial-gradient(circle at 7% 8%,#dceeff 0,transparent 25rem),radial-gradient(circle at 91% 13%,#f4defe 0,transparent 26rem),radial-gradient(circle at 48% 100%,#dff8e8 0,transparent 30rem),#f5f5f7;color:var(--apple-ink);letter-spacing:.01em}
    body::before{content:"";position:fixed;z-index:-1;inset:0;background:linear-gradient(115deg,transparent 0 44%,rgba(255,149,0,.08) 52%,transparent 63%),linear-gradient(300deg,transparent 0 36%,rgba(255,45,85,.07) 43%,transparent 55%);pointer-events:none}
    .app{position:relative;padding-top:42px}
    h1{display:flex;align-items:center;justify-content:center;gap:11px;font-size:34px;line-height:1.2;letter-spacing:-.045em;background:linear-gradient(95deg,#1d1d1f 15%,#005ecf 57%,#8a32c5 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1::before{content:"";width:16px;height:16px;border-radius:50%;background:conic-gradient(from 210deg,var(--apple-blue),var(--apple-purple),var(--apple-pink),var(--apple-orange),var(--apple-green),var(--apple-blue));box-shadow:0 3px 12px #007aff55;flex:none}
    h1 small{font-size:14px;letter-spacing:0;color:var(--apple-secondary);background:#ffffffa8;border:1px solid #ffffff;padding:4px 9px;border-radius:999px;-webkit-text-fill-color:var(--apple-secondary)}
    .lead{margin:11px 0 29px;text-align:center;font-size:16px;color:var(--apple-secondary)}
    .card{position:relative;overflow:hidden;background:var(--apple-surface);border:1px solid rgba(255,255,255,.86);border-radius:22px;box-shadow:0 12px 28px rgba(39,63,95,.09),inset 0 1px rgba(255,255,255,.75);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:transform .22s ease,box-shadow .22s ease}
    .card:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(39,63,95,.13),inset 0 1px rgba(255,255,255,.82)}
    .grid .card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--apple-blue),var(--apple-indigo),var(--apple-purple));opacity:.8}
    .grid .card:nth-child(2)::before{background:linear-gradient(90deg,var(--apple-purple),var(--apple-pink),var(--apple-orange))}
    .grid .card:nth-child(3)::before{background:linear-gradient(90deg,var(--apple-green),var(--apple-blue),var(--apple-indigo))}
    h2{display:flex;align-items:center;gap:8px;color:var(--apple-ink);font-size:18px;letter-spacing:-.025em}
    h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--apple-blue);box-shadow:13px 0 var(--apple-purple),26px 0 var(--apple-pink);margin-right:19px}
    label{color:#34343a;font-weight:650;font-size:14px}
    input,select,textarea{border-color:#d2d7e0;background:linear-gradient(145deg,#f6f8fb,#fff);box-shadow:inset 2px 2px 4px rgba(111,126,146,.14),inset -2px -2px 4px rgba(255,255,255,.95),0 1px 1px rgba(255,255,255,.92),0 3px 7px rgba(47,65,93,.08);transition:border-color .18s,box-shadow .18s,background .18s,transform .18s}
    input:hover,select:hover,textarea:hover{border-color:#aebfd7;background:linear-gradient(145deg,#f2f6fb,#fff);box-shadow:inset 2px 2px 4px rgba(111,126,146,.16),inset -2px -2px 4px #fff,0 4px 10px rgba(47,65,93,.12)}
    input:focus,select:focus,textarea:focus{outline:0;border-color:var(--apple-blue);background:#fff;box-shadow:inset 1px 1px 3px rgba(63,111,173,.12),inset -1px -1px 3px #fff,0 0 0 4px #007aff20,0 5px 12px #007aff18}
    button,.button{border-radius:12px;background:linear-gradient(180deg,#1683ff,#0071e3);box-shadow:0 5px 12px #007aff30, inset 0 1px #ffffff66;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
    button:hover,.button:hover{transform:translateY(-1px);filter:brightness(1.03);box-shadow:0 8px 16px #007aff3d}
    .button.secondary,button.secondary{background:#ffffffc9;color:#1769c7;border:1px solid #cce1ff;box-shadow:0 3px 10px #1668c211}
    #export-pdf{color:#fff;background:linear-gradient(135deg,#af52de,#6e5ee8)}#crop-zip{color:#fff;background:linear-gradient(135deg,#ff9500,#ff6b35)}#preview-button{color:#fff;background:linear-gradient(135deg,#34c759,#13a776)}
    button.danger{background:linear-gradient(135deg,#ff3b5c,#e62e4d);box-shadow:0 5px 12px #ff2d5530}
    #drop-zone{border:1.5px dashed #77b6ff;background:linear-gradient(135deg,#eef7ff,#f8f3ff 60%,#fff7ed);border-radius:17px;color:#386798;transition:transform .2s,box-shadow .2s}
    #drop-zone:hover{transform:scale(1.01);box-shadow:0 8px 20px #4d8ec722}.notice{border-left:4px solid var(--apple-blue);background:linear-gradient(90deg,#eaf4ff,#f1edff);color:#315a91;border-radius:11px}.photo{border-radius:18px}.photo img{background:linear-gradient(135deg,#edf4fb,#f9effc)}.photo-title strong{color:#245ba0}.icon-button{border-radius:9px}.hint{color:var(--apple-secondary)}
    @media(max-width:600px){.app{padding:24px 16px}h1{font-size:28px}.lead{font-size:14px}.card{border-radius:18px}}
    @media(prefers-color-scheme:dark){body{background:radial-gradient(circle at 5% 7%,#12345c 0,transparent 26rem),radial-gradient(circle at 92% 12%,#432557 0,transparent 28rem),#111214;color:#f5f5f7}.card{background:rgba(36,37,41,.75);border-color:#ffffff16;box-shadow:0 14px 34px #0004}h1{background:linear-gradient(95deg,#fff 10%,#72b5ff 58%,#e1a4ff 100%);-webkit-background-clip:text;background-clip:text}h2,label{color:#f5f5f7}input,select,textarea{background:linear-gradient(145deg,#202126,#2b2d33);border-color:#484a53;box-shadow:inset 2px 2px 5px #090a0d88,inset -1px -1px 3px #ffffff12,0 2px 5px #0004}.button.secondary,button.secondary{background:#2a374a;color:#9bcbff;border-color:#3e5e84}.notice{background:linear-gradient(90deg,#193d65,#31224d);color:#c8e3ff}}
  </style>
</head>
<body>
<main class="app">
  <h1>施工照片排版輸出工具 <small class="hint">修正版</small></h1>
  <p class="lead">匯入多張圖片（支援PDF轉圖片格式）、自動排版、匯出HTML、 PDF及Word</p>
  <section class="grid">
    <div class="card"><h2>報告資訊</h2>
      <div class="field"><label for="theme">報告主題</label><input id="theme" maxlength="100" placeholder="例如：第 3 期施工進度"></div>
      <div class="field"><label for="lot-label">欄位名稱（可自行調整）</label><input id="lot-label" maxlength="30" value="施工標別" placeholder="例如：施工位置、監造單位"></div>
      <div class="field"><label for="lot">欄位內容</label><input id="lot" maxlength="100" placeholder="例如：萬大線 CQ860 區段"></div>
      <div class="field"><label for="date">拍攝／報告日期</label><input id="date" type="date"></div>
      <label><input id="show-date" type="checkbox" checked style="width:auto"> 在輸出頁首顯示日期</label>
      <p id="roc-date" class="hint"></p>
    </div>
    <div class="card"><h2>版面與輸出</h2>
      <div class="field"><label for="orientation">方向</label><select id="orientation"><option value="portrait">A4 直式</option><option value="landscape">A4 橫式</option></select></div>
      <div class="field"><label for="per-page">每頁照片數</label><select id="per-page"><option value="2">2 張</option><option value="4" selected>4 張</option><option value="6">6 張</option><option value="8">8 張</option><option value="9">9 張</option><option value="12">12 張</option></select></div>
      <div class="field"><label for="quality">輸出品質</label><select id="quality"><option value="1280">標準（較快）</option><option value="1920" selected>高品質</option><option value="2560">最高品質（較慢）</option></select></div>
      <label><input id="captions" type="checkbox" checked style="width:auto"> 顯示照片說明</label><br><label><input id="borders" type="checkbox" checked style="width:auto"> 顯示框線</label>
    </div>
    <div class="card"><h2>加入照片</h2>
      <div id="drop-zone"><label for="files" class="button">選擇照片或 PDF</label><input id="files" class="hidden" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf"><p class="hint">支援 JPG、PNG、WebP、HEIC／HEIF 及 PDF。可拖曳檔案到此。</p></div>
      <p class="notice">為避免瀏覽器記憶體耗盡，PDF 頁面會轉為 JPEG Blob；移除照片後其暫存資源會立即釋放。</p>
    </div>
  </section>
  <section class="card" style="margin-top:16px"><h2>輸出</h2><p class="hint">HTML 報告可直接開啟列印為 PDF；也可匯出 PNG ZIP、多頁 PDF ZIP 或可編輯 Word。</p><div class="actions"><button id="export-html">輸出 HTML 報告</button><button id="export-layout" class="secondary">輸出排版 PNG ZIP</button><button id="export-pdf" class="secondary">輸出排版 PDF ZIP</button><button id="export-word" class="secondary">輸出可編輯 Word</button><button id="crop-zip" class="secondary">全部裁切為 4:3 JPG ZIP</button><button id="preview-button" class="secondary">預覽第一頁</button><button id="clear" class="danger">清空照片</button></div></section>
  <section id="photo-list" class="photos" aria-live="polite"><p class="empty">尚未加入照片。</p></section>
</main>
<div id="busy" class="overlay" role="status" aria-live="assertive"><div class="status"><div class="spinner"></div><strong id="busy-text">處理中…</strong></div></div>
<dialog id="message"><div class="dialog-body"><h2 id="message-title"></h2><p id="message-text"></p><div id="download-area" class="hidden"></div><div class="dialog-actions"><button id="message-close" class="secondary">關閉</button></div></div></dialog>
<dialog id="preview-dialog"><div class="dialog-body"><h2>第一頁預覽</h2><img id="preview" alt="排版預覽"><div class="dialog-actions"><button id="preview-close" class="secondary">關閉</button></div></div></dialog>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const els = { theme:$('theme'), lotLabel:$('lot-label'), lot:$('lot'), date:$('date'), showDate:$('show-date'), roc:$('roc-date'), orientation:$('orientation'), perPage:$('per-page'), quality:$('quality'), captions:$('captions'), borders:$('borders'), files:$('files'), drop:$('drop-zone'), list:$('photo-list'), busy:$('busy'), busyText:$('busy-text'), message:$('message'), messageTitle:$('message-title'), messageText:$('message-text'), downloadArea:$('download-area'), previewDialog:$('preview-dialog'), preview:$('preview') };
  let photos = [], busy = false, downloadUrl = null;
  const ids = () => crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
  const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const safeName = value => String(value || '施工照片報告').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 100);
  const setBusy = (on, text='處理中…') => { busy=on; els.busyText.textContent=text; els.busy.classList.toggle('visible',on); document.querySelectorAll('button, input, select').forEach(el => { if (el.id !== 'message-close' && el.id !== 'preview-close') el.disabled=on; }); };
  const showMessage = (title, text, url=null, name='下載檔案') => { if(downloadUrl) URL.revokeObjectURL(downloadUrl); downloadUrl=url; els.messageTitle.textContent=title; els.messageText.textContent=text; els.downloadArea.replaceChildren(); els.downloadArea.classList.toggle('hidden',!url); if(url){const link=document.createElement('a');link.className='button';link.href=url;link.download=name;link.textContent='下載檔案';els.downloadArea.append(link);} els.message.showModal(); };
  const closeMessage = () => { els.message.close(); if(downloadUrl){URL.revokeObjectURL(downloadUrl);downloadUrl=null;} };
  const canvasBlob = (canvas, type='image/jpeg', quality=.88) => new Promise((resolve,reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('瀏覽器無法建立圖片資料。')),type,quality));
  const loadImage = url => new Promise((resolve,reject) => { const image=new Image(); image.onload=()=>resolve(image); image.onerror=()=>reject(new Error('圖片無法解碼，請確認檔案格式。')); image.src=url; });
  const drawContain = (ctx,img,x,y,w,h,padding=0) => { const ratio=Math.min((w-padding*2)/img.width,(h-padding*2)/img.height); const iw=img.width*ratio,ih=img.height*ratio; ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih); };
  const wrapLines = (ctx,text,width,maxLines=3) => { const words=String(text||'').split(/(\s+)/).filter(Boolean); const lines=[]; let line=''; for(const word of words){const candidate=line+word;if(ctx.measureText(candidate).width<=width || !line) line=candidate;else{lines.push(line.trim());line=word;} if(lines.length===maxLines)break;} if(line && lines.length<maxLines) lines.push(line.trim()); if(lines.length===maxLines && words.join('').length>lines.join('').length) lines[maxLines-1]=lines[maxLines-1].replace(/…?$/,'')+'…'; return lines.length?lines:['']; };
  const gridFor = count => ({2:[1,2],4:[2,2],6:[2,3],8:[2,4],9:[3,3],12:[3,4]}[count] || [2,2]);
  const dateText = value => { if(!value)return ''; const [y,m,d]=value.split('-').map(Number); return Number.isFinite(y) ? `${y-1911}年${m}月${d}日` : ''; };
  const saveSettings = () => { try { localStorage.setItem('construction-photo-settings-v2',JSON.stringify({theme:els.theme.value,lotLabel:els.lotLabel.value,lot:els.lot.value,date:els.date.value,showDate:els.showDate.checked,orientation:els.orientation.value,perPage:els.perPage.value,quality:els.quality.value,captions:els.captions.checked,borders:els.borders.checked})); } catch {} els.roc.textContent=dateText(els.date.value); };
  const loadSettings = () => { try { const data=JSON.parse(localStorage.getItem('construction-photo-settings-v2')||'{}'); for(const key of ['theme','lotLabel','lot','date','orientation','perPage','quality'])if(typeof data[key]==='string'&&els[key])els[key].value=data[key]; for(const key of ['showDate','captions','borders'])if(typeof data[key]==='boolean')els[key].checked=data[key]; } catch { localStorage.removeItem('construction-photo-settings-v2'); } saveSettings(); };
  const revokePhoto = photo => { if(photo?.url?.startsWith('blob:')) URL.revokeObjectURL(photo.url); };
  const render = () => { els.list.replaceChildren(); if(!photos.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='尚未加入照片。';els.list.append(empty);return;} photos.forEach((photo,index)=>{const card=document.createElement('article');card.className='photo card';const image=document.createElement('img');image.src=photo.url;image.alt=`施工照片 ${index+1}`;const body=document.createElement('div');body.className='photo-content';const title=document.createElement('div');title.className='photo-title';const label=document.createElement('strong');label.textContent=`照片 ${index+1}`;const remove=document.createElement('button');remove.className='danger icon-button';remove.type='button';remove.textContent='移除';remove.addEventListener('click',()=>{const [deleted]=photos.splice(index,1);revokePhoto(deleted);render();});title.append(label,remove);const text=document.createElement('textarea');text.rows=1;text.maxLength=500;text.placeholder='請輸入施工說明…';text.value=photo.description;text.addEventListener('input',()=>photo.description=text.value);body.append(title,text);card.append(image,body);els.list.append(card);}); };
  const pageImage = async (index,total) => { const per=Number(els.perPage.value), [cols,rows]=gridFor(per); const landscape=els.orientation.value==='landscape', max=Number(els.quality.value); const short=Math.min(max,Math.round(max/Math.SQRT2)), long=Math.round(short*Math.SQRT2); const canvas=document.createElement('canvas');canvas.width=landscape?long:short;canvas.height=landscape?short:long;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);const margin=Math.round(canvas.width*.055), gap=Math.round(canvas.width*.018);let top=margin; if(index===0){ctx.fillStyle='#111827';ctx.textAlign='center';ctx.font=`700 ${Math.round(canvas.width*.04)}px "Microsoft JhengHei",sans-serif`;ctx.fillText(els.theme.value||'施工照片報告',canvas.width/2,top+Math.round(canvas.width*.04));top+=Math.round(canvas.width*.085);ctx.font=`${Math.round(canvas.width*.021)}px "Microsoft JhengHei",sans-serif`;const lotText=els.lot.value&&`${els.lotLabel.value.trim()||'施工標別'}：${els.lot.value}`,dateLabel=els.showDate.checked&&els.date.value&&`日期：${dateText(els.date.value)}`;if(lotText||dateLabel){ctx.textAlign='left';if(lotText)ctx.fillText(lotText,margin,top);ctx.textAlign='right';if(dateLabel)ctx.fillText(dateLabel,canvas.width-margin,top);top+=Math.round(canvas.width*.045);}} const footer=Math.round(canvas.width*.05), usableW=canvas.width-margin*2,usableH=canvas.height-top-footer-margin, cellW=(usableW-gap*(cols-1))/cols,cellH=(usableH-gap*(rows-1))/rows;const slice=photos.slice(index*per,(index+1)*per);for(let n=0;n<slice.length;n++){const col=n%cols,row=Math.floor(n/cols),x=margin+col*(cellW+gap),y=top+row*(cellH+gap),caption=els.captions.checked?Math.min(cellH*.28,Math.round(canvas.width*.095)):0; if(els.borders.checked){ctx.strokeStyle='#aab3c1';ctx.lineWidth=1;ctx.strokeRect(x,y,cellW,cellH);}const image=await loadImage(slice[n].url);drawContain(ctx,image,x,y,cellW,cellH-caption,Math.round(canvas.width*.008));if(els.captions.checked){if(els.borders.checked){ctx.beginPath();ctx.moveTo(x,y+cellH-caption);ctx.lineTo(x+cellW,y+cellH-caption);ctx.stroke();}ctx.fillStyle='#111827';ctx.font=`${Math.max(11,Math.round(canvas.width*.018))}px "Microsoft JhengHei",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const lines=wrapLines(ctx,slice[n].description,cellW-14,3),lh=Math.max(14,Math.round(canvas.width*.023));lines.forEach((line,lineIndex)=>ctx.fillText(line,x+cellW/2,y+cellH-caption/2+(lineIndex-(lines.length-1)/2)*lh));}}ctx.fillStyle='#526072';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font=`${Math.round(canvas.width*.017)}px sans-serif`;ctx.fillText(`第 ${index+1} 頁／共 ${total} 頁`,canvas.width/2,canvas.height-margin/2);return canvas; };
  const addFiles = async files => { if(busy||!files.length)return; setBusy(true,'正在處理檔案…');const added=[];let completed=false;try{for(let i=0;i<files.length;i++){const file=files[i];setBusy(true,`正在處理 ${i+1}／${files.length}：${file.name}`);if(file.type==='application/pdf'){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let p=1;p<=pdf.numPages;p++){setBusy(true,`正在轉換 PDF 第 ${p}／${pdf.numPages} 頁…`);const page=await pdf.getPage(p),viewport=page.getViewport({scale:1.5}),canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;const blob=await canvasBlob(canvas,'image/jpeg',.88);added.push({id:ids(),url:URL.createObjectURL(blob),description:''});canvas.width=canvas.height=1;}}else{let blob=file;if(/\.(heic|heif)$/i.test(file.name)){if(typeof heic2any!=='function')throw new Error('HEIC 轉檔元件尚未載入。');blob=await heic2any({blob:file,toType:'image/jpeg',quality:.88});}const url=URL.createObjectURL(blob);try{await loadImage(url);added.push({id:ids(),url,description:''});}catch(error){URL.revokeObjectURL(url);throw error;}}}completed=true;}catch(error){added.forEach(revokePhoto);showMessage('匯入失敗',error.message||'檔案無法處理。');}finally{if(completed)photos.push(...added);render();setBusy(false);els.files.value='';}};
  const exportLayout = async () => { if(!photos.length)return showMessage('尚無照片','請先加入至少一張照片。');setBusy(true,'正在產生排版…');try{const zip=new JSZip(),per=Number(els.perPage.value),total=Math.ceil(photos.length/per),base=safeName(els.theme.value);for(let i=0;i<total;i++){setBusy(true,`正在繪製第 ${i+1}／${total} 頁…`);const canvas=await pageImage(i,total);zip.file(`${base}_頁${String(i+1).padStart(2,'0')}.png`,await canvasBlob(canvas,'image/png'));canvas.width=canvas.height=1;}setBusy(true,'正在壓縮 ZIP…');showMessage('排版已產生','請下載 ZIP 檔案。',URL.createObjectURL(await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}})),`${base}_縮圖排版.zip`);}catch(error){showMessage('產生失敗',error.message||'無法產生排版。');}finally{setBusy(false);}};
  const exportPdfZip = async () => { if(!photos.length)return showMessage('尚無照片','請先加入至少一張照片。');if(!window.jspdf?.jsPDF)return showMessage('PDF 元件尚未載入','請確認網路連線後重新開啟工具。');setBusy(true,'正在產生排版 PDF…');try{const per=Number(els.perPage.value),total=Math.ceil(photos.length/per),base=safeName(els.theme.value),landscape=els.orientation.value==='landscape';let pdf;for(let i=0;i<total;i++){setBusy(true,`正在轉換第 ${i+1}／${total} 頁為 PDF…`);const canvas=await pageImage(i,total);const format=[canvas.width,canvas.height];if(!pdf)pdf=new window.jspdf.jsPDF({orientation:landscape?'landscape':'portrait',unit:'px',format,hotfixes:['px_scaling']});else pdf.addPage(format,landscape?'landscape':'portrait');pdf.addImage(canvas,'PNG',0,0,canvas.width,canvas.height,undefined,'FAST');canvas.width=canvas.height=1;}setBusy(true,'正在壓縮 PDF ZIP…');const zip=new JSZip();zip.file(`${base}_排版報告.pdf`,pdf.output('blob'));showMessage('排版 PDF 已產生','ZIP 內包含一份多頁排版 PDF。',URL.createObjectURL(await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}})),`${base}_排版PDF.zip`);}catch(error){showMessage('PDF 產生失敗',error.message||'無法建立 PDF。');}finally{setBusy(false);}};
  const cropToFourThree = async photo => { const image=await loadImage(photo.url),ratio=4/3;let sx=0,sy=0,sw=image.width,sh=image.height;if(sw/sh>ratio){sw=sh*ratio;sx=(image.width-sw)/2;}else if(sw/sh<ratio){sh=sw/ratio;sy=(image.height-sh)/2;}const canvas=document.createElement('canvas');canvas.width=Math.round(sw);canvas.height=Math.round(sh);canvas.getContext('2d').drawImage(image,sx,sy,sw,sh,0,0,canvas.width,canvas.height);const blob=await canvasBlob(canvas,'image/jpeg',.9);canvas.width=canvas.height=1;return blob; };
  const exportCrop = async () => { if(!photos.length)return showMessage('尚無照片','請先加入至少一張照片。');setBusy(true,'正在裁切為 4:3…');try{const zip=new JSZip(),base=safeName(els.theme.value);for(let i=0;i<photos.length;i++){setBusy(true,`正在裁切第 ${i+1}／${photos.length} 張…`);zip.file(`${base}_${String(i+1).padStart(3,'0')}.jpg`,await cropToFourThree(photos[i]));}setBusy(true,'正在壓縮 ZIP…');showMessage('4:3 照片已產生','所有照片皆已置中裁切為一致的 4:3 比例。',URL.createObjectURL(await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}})),`${base}_4x3照片.zip`);}catch(error){showMessage('裁切失敗',error.message||'無法裁切照片。');}finally{setBusy(false);}};
  const exportHtml = async () => { if(!photos.length)return showMessage('尚無照片','請先加入至少一張照片。');setBusy(true,'正在建立可列印 HTML…');try{const per=Number(els.perPage.value),total=Math.ceil(photos.length/per),base=safeName(els.theme.value),landscape=els.orientation.value==='landscape';let pages='';for(let p=0;p<total;p++){setBusy(true,`正在內嵌圖片 ${p+1}／${total} 頁…`);const canvas=await pageImage(p,total);const data=canvas.toDataURL('image/jpeg',.9);canvas.width=canvas.height=1;pages+=`<section class="page"><img src="${data}" alt="第 ${p+1} 頁"></section>`;}const title=escapeHtml(els.theme.value||'施工照片報告');const doc=`<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>${title}</title><style>@page{size:A4 ${landscape?'landscape':'portrait'};margin:0}body{margin:0;background:#ddd}.page{width:100%;height:100vh;break-after:page;display:grid;place-items:center;background:#fff}.page img{width:100%;height:100%;object-fit:contain}@media print{body{background:#fff}.page{height:100vh}}</style>${pages}</html>`;showMessage('HTML 報告已產生','可先開啟檢查，再使用瀏覽器的「列印」功能輸出 PDF。',URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'})),`${base}_${els.date.value||'未設定日期'}.html`);}catch(error){showMessage('輸出失敗',error.message||'無法建立 HTML。');}finally{setBusy(false);}};
  $('export-layout').addEventListener('click',exportLayout);$('export-pdf').addEventListener('click',exportPdfZip);$('crop-zip').addEventListener('click',exportCrop);$('export-html').addEventListener('click',exportHtml);$('preview-button').addEventListener('click',async()=>{if(!photos.length)return showMessage('尚無照片','請先加入至少一張照片。');setBusy(true,'正在產生預覽…');try{const canvas=await pageImage(0,Math.ceil(photos.length/Number(els.perPage.value)));els.preview.src=canvas.toDataURL('image/png');els.previewDialog.showModal();canvas.width=canvas.height=1;}catch(error){showMessage('預覽失敗',error.message||'無法產生預覽。');}finally{setBusy(false);}});$('clear').addEventListener('click',()=>{if(!photos.length)return; if(confirm('確定清空所有照片？')){photos.forEach(revokePhoto);photos=[];render();}});els.files.addEventListener('change',event=>addFiles([...event.target.files]));['dragenter','dragover'].forEach(type=>els.drop.addEventListener(type,event=>{event.preventDefault();els.drop.style.borderColor='#1769e0';}));['dragleave','drop'].forEach(type=>els.drop.addEventListener(type,event=>{event.preventDefault();els.drop.style.borderColor='';}));els.drop.addEventListener('drop',event=>addFiles([...event.dataTransfer.files]));document.querySelectorAll('#theme,#lot,#date,#orientation,#per-page,#quality,#captions,#borders').forEach(el=>el.addEventListener('change',saveSettings));$('message-close').addEventListener('click',closeMessage);$('preview-close').addEventListener('click',()=>{els.preview.src='';els.previewDialog.close();});window.addEventListener('beforeunload',()=>photos.forEach(revokePhoto));loadSettings();render();
  const wordImageBytes = async photo => { const image=await loadImage(photo.url);const longest=640,ratio=Math.min(1,longest/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const blob=await canvasBlob(canvas,'image/jpeg',.88);canvas.width=canvas.height=1;return new Uint8Array(await blob.arrayBuffer()); };
  const exportWord = async () => { if(!photos.length)return showMessage('尚無照片','請先加入至少一張照片。');if(!window.docx)return showMessage('Word 元件尚未載入','請確認網路連線後重新開啟工具。');setBusy(true,'正在建立可編輯 Word…');try{const D=window.docx,per=Number(els.perPage.value),[cols]=gridFor(per),total=Math.ceil(photos.length/per),children=[];for(let page=0;page<total;page++){if(page>0)children.push(new D.Paragraph({pageBreakBefore:true}));if(page===0){children.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:180},children:[new D.TextRun({text:els.theme.value||'施工照片報告',bold:true,size:36,font:'Microsoft JhengHei'})]}));const meta=[];if(els.lot.value)meta.push(`${els.lotLabel.value.trim()||'施工標別'}：${els.lot.value}`);if(els.showDate.checked&&els.date.value)meta.push(`日期：${dateText(els.date.value)}`);if(meta.length)children.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:240},children:[new D.TextRun({text:meta.join('　　'),size:22,font:'Microsoft JhengHei'})]}));}const slice=photos.slice(page*per,(page+1)*per),rows=[];for(let start=0;start<slice.length;start+=cols){const cells=[];for(let col=0;col<cols;col++){const photo=slice[start+col];if(!photo){cells.push(new D.TableCell({children:[new D.Paragraph('')]}));continue;}setBusy(true,`正在嵌入 Word 圖片 ${page*per+start+col+1}／${photos.length}…`);const bytes=await wordImageBytes(photo);const maxWidth=cols===1?500:245;const imageParagraph=new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.ImageRun({data:bytes,type:'jpg',transformation:{width:maxWidth,height:Math.round(maxWidth*.75)}})]});const captionParagraph=new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun({text:els.captions.checked?(photo.description||'請在此輸入照片說明'):'',size:20,font:'Microsoft JhengHei'})]});cells.push(new D.TableCell({margins:{top:80,bottom:80,left:80,right:80},children:[imageParagraph,captionParagraph]}));}rows.push(new D.TableRow({children:cells}));}children.push(new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows}));}const document=new D.Document({sections:[{properties:{page:{margin:{top:720,right:720,bottom:720,left:720}}},children}]});const blob=await D.Packer.toBlob(document),name=`${safeName(els.theme.value)}_${els.date.value||'未設定日期'}.docx`;showMessage('可編輯 Word 已建立','可直接在 Word 修改主題、欄位、日期、照片說明及調整照片大小。',URL.createObjectURL(blob),name);}catch(error){console.error('Word 產生失敗',error);showMessage('Word 產生失敗',error.message||'無法建立 Word 檔案。');}finally{setBusy(false);}};
  $('export-word').addEventListener('click',exportWord);
  els.lotLabel.addEventListener('change',saveSettings);
  els.showDate.addEventListener('change',saveSettings);
})();
